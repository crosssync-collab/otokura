  <!-- 蔵の屋根 -->
  <path d="M136 214 L256 140 L376 214" fill="none" stroke="#f3eeff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- レコード -->
  <circle cx="256" cy="290" r="96" fill="#f3eeff"/>
  <circle cx="256" cy="290" r="66" fill="none" stroke="#5a3fb0" stroke-width="5" opacity=".45"/>
  <circle cx="256" cy="290" r="30" fill="#c9b8ff"/>
  <circle cx="256" cy="290" r="8" fill="#2c1d63"/>
</svg>
