<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 全面を塗る(Android のマスク・iOS の角丸は OS 側で切る)。絵は中央の円(半径 205)に収まるよう縮める -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3db4ff"/><stop offset="1" stop-color="#0a4f8f"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <g transform="translate(256 256) scale(0.82) translate(-256 -275)" fill="#ffffff">
    <!-- 蔵の屋根がヘッドホンのバンド -->
    <path d="M108 318 V262 L256 132 L404 262 V318" fill="none" stroke="#ffffff" stroke-width="32" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 左右のイヤーカップ -->
    <rect x="88" y="290" width="76" height="128" rx="32"/>
    <rect x="348" y="290" width="76" height="128" rx="32"/>
    <!-- 間に音量の棒 -->
    <rect x="216" y="344" width="18" height="50" rx="9"/>
    <rect x="246" y="304" width="18" height="90" rx="9"/>
    <rect x="276" y="330" width="18" height="64" rx="9"/>
  </g>
</svg>
