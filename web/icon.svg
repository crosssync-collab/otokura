<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3fb0"/>
      <stop offset="1" stop-color="#2c1d63"/>
    </linearGradient>
  </defs>
  <!-- 全面を塗る(Android のマスク・iOS の角丸は OS 側で切る)。絵は中央 60% に収める -->
