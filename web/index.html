<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音蔵</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d8fd6">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="音蔵">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --h:202; --ps:85%; --pl:40%; --cr:16px;   /* 既定はペリカンのバイブラントブルー。カバーの色に合わせるときは JS で上書き */
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --bg:hsl(var(--h) 30% 97%); --s1:hsl(var(--h) 28% 94%); --s2:hsl(var(--h) 26% 91%); --s3:hsl(var(--h) 24% 87%);
  --text:hsl(var(--h) 25% 12%); --muted:hsl(var(--h) 10% 40%); --line:hsl(var(--h) 18% 80%);
  --pri:hsl(var(--h) var(--ps) var(--pl)); --on-pri:#fff; --pc:hsl(var(--h) 70% 88%); --on-pc:hsl(var(--h) 60% 18%);
  --ok:#2E7D4F; --err:#B3261E; --star:#C98A00;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:hsl(var(--h) 18% 8%); --s1:hsl(var(--h) 16% 12%); --s2:hsl(var(--h) 15% 16%); --s3:hsl(var(--h) 14% 21%);
    --text:hsl(var(--h) 20% 92%); --muted:hsl(var(--h) 8% 68%); --line:hsl(var(--h) 12% 26%);
    --pri:hsl(var(--h) 85% 80%); --on-pri:hsl(var(--h) 50% 14%); --pc:hsl(var(--h) 35% 26%); --on-pc:hsl(var(--h) 90% 90%);
    --ok:#7FD6A0; --err:#F2A19B; --star:#F5C84B;
  }
}
:root[data-theme="dark"]{
  --bg:hsl(var(--h) 18% 8%); --s1:hsl(var(--h) 16% 12%); --s2:hsl(var(--h) 15% 16%); --s3:hsl(var(--h) 14% 21%);
  --text:hsl(var(--h) 20% 92%); --muted:hsl(var(--h) 8% 68%); --line:hsl(var(--h) 12% 26%);
  --pri:hsl(var(--h) 85% 80%); --on-pri:hsl(var(--h) 50% 14%); --pc:hsl(var(--h) 35% 26%); --on-pc:hsl(var(--h) 90% 90%);
  --ok:#7FD6A0; --err:#F2A19B; --star:#F5C84B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--body);overflow:hidden;transition:background-color .5s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
input{font:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
svg{display:block;flex:none}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"col" "mini" "nav"}
.col{grid-area:col;display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;align-items:center;gap:2px;padding:8px 8px 4px 16px;min-height:60px}
.bar h1{font-size:26px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.sub{padding-left:6px}
.bar.sub h1{font-size:19px}
.bar .cnt{flex:1;font-family:var(--display);font-weight:700;font-size:18px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text)}
.ib:hover{background:var(--s2)}
.ib.on{color:var(--pri)}
.ib.sm{width:36px;height:36px}
.page{flex:1;overflow:auto;padding:4px 16px 24px;overscroll-behavior:contain}
.nav{grid-area:nav;display:flex;justify-content:space-around;background:var(--s1);padding:6px 8px}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:2px 0}
.ni .pill{width:62px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background-color .2s}
.ni[aria-current="page"]{color:var(--text);font-weight:500}
.ni[aria-current="page"] .pill{background:var(--pc);color:var(--on-pc)}
.ni.desk{display:none}
@media (min-width:900px){
  .app{grid-template-columns:92px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"nav col" "mini mini"}
  .nav{flex-direction:column;justify-content:flex-start;gap:14px;padding:18px 6px;background:transparent}
  .ni{flex:none}
  .ni.desk{display:flex;margin-top:auto}
  .page{padding:4px 32px 28px}
  .bar{padding-left:32px}
  .bar.sub{padding-left:24px}
}

/* ---------- atoms ---------- */
.cover{aspect-ratio:1;background-size:cover;border-radius:var(--cr);flex:none;position:relative;overflow:hidden}
.cover .eq{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.38);color:#fff}
.is-playing > .cover .eq,.cover.is-playing .eq{display:grid}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:21px;background:var(--pri);color:var(--on-pri);font-weight:500}
.btn.tonal{background:var(--pc);color:var(--on-pc)}
.btn.ghost{background:transparent;color:var(--pri);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:8px;font-size:12px;background:var(--s2);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok)} .chip.err{color:var(--err)} .chip.pri{background:var(--pc);color:var(--on-pc)}
button.chip{cursor:pointer;height:34px;border-radius:17px;font-size:14px;padding:0 16px}
button.chip[aria-pressed="true"],button.chip[aria-selected="true"]{background:var(--pc);color:var(--on-pc);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.muted{color:var(--muted)}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px}

/* shortcuts */
.sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px 6px;margin:6px 0 18px}
.sc button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;padding:4px 0}
.sc .ic{width:56px;height:56px;border-radius:18px;background:var(--pc);color:var(--on-pc);display:grid;place-items:center}
.sc.compact{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sc.compact button{flex-direction:row;background:var(--s2);border-radius:14px;padding:8px 12px;gap:10px;font-size:14px}
.sc.compact .ic{width:32px;height:32px;border-radius:10px}
.sc.list{grid-template-columns:1fr;gap:0}
.sc.list button{flex-direction:row;gap:14px;font-size:15px;padding:8px 4px;border-bottom:1px solid var(--line)}
.sc.list .ic{width:40px;height:40px;border-radius:12px}
.sc .ic{background-size:cover;background-position:center}
.sc .ic svg{display:none}   /* 写真を使うのでアイコンは出さない(写真が読めないときだけ下の色) */
.sc.photo{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (min-width:700px){.sc.photo{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}}
.sc.photo button{position:relative;display:block;padding:0;aspect-ratio:1;border-radius:14px;overflow:hidden}
.sc.photo .ic{width:100%;height:100%;border-radius:0}
.sc.photo button>span:last-child{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;font-size:11px;font-weight:700;line-height:1.2;color:#fff;text-align:left;
  background:linear-gradient(transparent,rgba(0,0,0,.7));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:700px){.sc.photo button>span:last-child{font-size:13px;padding:20px 8px 7px}}

/* rows & cards */
.hrow{margin-bottom:22px}
.hh{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.hh h2{font-size:19px;flex:1}
.hh a,.hh button{color:var(--muted);display:flex;align-items:center;font-size:13px}
.shelf{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding-inline:16px}
.shelf::-webkit-scrollbar{display:none}
.shelf .card{width:144px;flex:none;scroll-snap-align:start}
@media (min-width:900px){.shelf{margin:0 -32px;padding-left:32px;padding-right:32px;scroll-padding-inline:32px}.shelf .card{width:164px}}
/* 入りきらない棚: 続きがある側の端をぼかし、見出しに ‹ › を出す */
.shelf.more-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent)}
.shelf.more-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 56px);mask-image:linear-gradient(90deg,transparent,#000 56px)}
.shelf.more-l.more-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 56px,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,transparent,#000 56px,#000 calc(100% - 56px),transparent)}
.shnav{display:flex;gap:2px;margin-left:4px}
.shnav button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--text)}
.shnav button:disabled{opacity:.35;cursor:default}
/* 入りきらない文字: 止まってから横に流して全体を見せ、また戻る */
.mq{text-overflow:clip!important}
.mq>.mq-in{display:inline-block;animation:mq var(--mq-t,8s) linear infinite alternate}
@keyframes mq{0%,18%{transform:translateX(0)}82%,100%{transform:translateX(var(--mq-d,0))}}
@media (prefers-reduced-motion:reduce){.mq>.mq-in{animation:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:18px 14px}
.card{display:block;text-align:left;position:relative;min-width:0}
.card .cover{width:100%;margin-bottom:8px}
.card b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.card .ck,.srow .ck{display:none}
.sel-on .card .cover::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.18)}
.card.sel .cover{outline:3px solid var(--pri);outline-offset:-3px}
.card.sel .ck{display:grid;position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--on-pri);place-items:center;z-index:2}
.round .cover{border-radius:50%}
.tile{border-radius:var(--cr);aspect-ratio:16/10;padding:12px;display:flex;align-items:flex-end;color:#fff;font-family:var(--display);font-weight:700;font-size:17px;text-shadow:0 1px 6px rgba(0,0,0,.35)}

/* lists */
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:12px;padding:6px 4px 6px 8px;border-radius:14px;cursor:pointer;position:relative}
.srow:hover{background:var(--s1)}
.srow .no{width:28px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.srow .cover{width:48px;border-radius:10px}
.srow .tt{min-width:0}
.srow .tt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .tt small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.srow .du{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.srow.is-playing{background:var(--pc);color:var(--on-pc)}
.srow.is-playing .no,.srow.is-playing small,.srow.is-playing .du{color:inherit;opacity:.8}
.srow.sel{background:var(--pc)}
.fav-on{color:var(--pri)}
.lrow{display:flex;align-items:center;gap:14px;padding:8px;border-radius:14px;width:100%;text-align:left}
.lrow:hover{background:var(--s1)}
.lrow .cover{width:56px;border-radius:12px}
.lrow .tt{min-width:0;flex:1}
.lrow b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.round .cover{border-radius:50%}

/* detail header */
.dh{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:end;margin:6px 0 16px}
.dh .cover{width:100%;border-radius:calc(var(--cr) + 4px)}
.dh.round .cover{border-radius:50%}
.dh h1{font-size:24px;line-height:1.25;margin-bottom:4px}
.dh .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.winfo{margin:0 0 16px;font-size:14px;line-height:1.7}.winfo:empty{display:none}.winfo p{margin:8px 0 0}.winfo .meta{display:flex;gap:6px;flex-wrap:wrap}.winfo .wfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
@media (max-width:520px){.dh{grid-template-columns:110px minmax(0,1fr)}.dh h1{font-size:20px}}
.toolbar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.qf{flex:1;display:flex;align-items:center;gap:8px;height:40px;border-radius:20px;background:var(--s2);padding:0 14px;color:var(--muted);min-width:0}
.qf input{flex:1;background:none;border:0;color:var(--text);min-width:0}
.qf input:focus-visible{outline:none}
.qf:focus-within{outline:2px solid var(--pri)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;color:var(--muted);margin-bottom:10px}
.crumbs button{padding:4px 8px;border-radius:8px}
.crumbs button:last-child{color:var(--text);font-weight:500}
.frow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;cursor:pointer}
.frow:hover{background:var(--s1)}
.frow small{color:var(--muted);display:block}

/* settings */
.group{margin:14px 0 6px;color:var(--pri);font-size:13px;font-weight:700;padding:0 4px}
.panel{background:var(--s1);border-radius:20px;overflow:hidden}
.prow{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left}
.prow + .prow{border-top:1px solid var(--line)}
.prow .tt{flex:1;min-width:0}
.prow .tt b{display:block;font-weight:500}
.prow .tt small{display:block;color:var(--muted)}
.prow .lead{color:var(--pri)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--s3);box-shadow:inset 0 0 0 2px var(--muted);position:relative;flex:none;transition:background-color .15s}
.sw::after{content:"";position:absolute;top:7px;left:7px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s,background-color .15s,width .15s,height .15s,top .15s,left .15s}
.sw[aria-checked="true"]{background:var(--pri);box-shadow:none}
.sw[aria-checked="true"]::after{background:var(--on-pri);transform:translateX(20px);width:22px;height:22px;top:4px;left:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.rng{display:flex;align-items:center;gap:12px;min-width:170px}
.rng input{flex:1;accent-color:var(--pri)}
.rng output{min-width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.radio{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left}
.radio + .radio{border-top:1px solid var(--line)}
.dot{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--muted);flex:none;display:grid;place-items:center}
.radio[aria-checked="true"] .dot{box-shadow:inset 0 0 0 2px var(--pri)}
.radio[aria-checked="true"] .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--pri)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input:not([type=checkbox]),.form select{background:var(--s2);border:1px solid transparent;border-radius:12px;padding:10px 12px;color:var(--text);font:inherit}
.form input[type=checkbox]{width:18px;height:18px;accent-color:var(--pri)}
.form .full{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.result.ok{color:var(--ok)} .result.err{color:var(--err)}
.bar6{height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.bar6 i{display:block;height:100%;width:0;background:var(--pri)}

/* mini player */
.mini{grid-area:mini;margin:6px 8px;background:var(--s3);border-radius:24px;overflow:hidden;touch-action:pan-y;position:relative}
@media (min-width:900px){.mini{margin:0 16px 12px}}
.mini .tr{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;cursor:pointer;transition:transform .2s}
.mini .cover{width:48px;border-radius:14px}
.mini .tt{flex:1;min-width:0}
.mini .tt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tt small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.mini .pb{height:3px;background:var(--line)}
.mini .pb i{display:block;height:100%;background:var(--pri);width:0}
.mini .castchip{display:none}
@media (min-width:600px){.mini .castchip{display:inline-flex}}
.pbtn{width:44px;height:44px;border-radius:50%;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;flex:none}

/* expanded player */
.xp{position:fixed;inset:0;z-index:20;background:var(--bg);transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);visibility:hidden}
.xp.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.xp::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,var(--pc),transparent 75%);opacity:.9}
.xp.bg-plain::before{display:none}
.xp.bg-glow::before{background:radial-gradient(circle at 30% 20%,var(--pc),transparent 55%),radial-gradient(circle at 80% 60%,hsl(calc(var(--h) + 50) 60% 40% / .35),transparent 55%);animation:glow 14s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.15) translate(2%,3%)}}
.xp .in{position:relative;max-width:540px;margin:0 auto;padding:6px 22px 20px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.xtop{display:flex;align-items:center;gap:4px}
.xtop .ib.act{background:var(--pc);color:var(--on-pc)}
.xtop .ctx{flex:1;text-align:center;min-width:0}
.xtop .ctx small{display:block;color:var(--muted);font-size:12px}
.xtop .ctx b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.xart{width:min(100%,44vh);aspect-ratio:1;margin:4px auto;border-radius:calc(var(--cr) + 12px);cursor:pointer;box-shadow:0 18px 44px rgba(0,0,0,.28);position:relative;overflow:hidden;background-size:cover}
.xart .paused{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.28);color:#fff;opacity:0;transition:opacity .2s}
.xart.is-paused .paused{opacity:1}
/* lyrics */
.lyrwrap{position:relative;width:100%;margin:2px auto 0}
.lyr{--fs:24px;width:100%;height:min(54vh,540px);min-height:300px;overflow:auto;padding:38% 4px 50%;font-family:var(--display);font-weight:700;font-size:var(--fs);line-height:1.32;scrollbar-width:none;overscroll-behavior:contain;
  mask-image:linear-gradient(transparent,#000 14%,#000 80%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 80%,transparent)}
.lyr::-webkit-scrollbar{display:none}
.lyr.fs-s{--fs:20px} .lyr.fs-l{--fs:30px}
@media (min-width:700px){.lyr{--fs:28px}.lyr.fs-s{--fs:22px}.lyr.fs-l{--fs:34px}}
.ll{padding:8px 10px;margin:2px 0;border-radius:14px;cursor:pointer;opacity:.4;transform-origin:left center;
  transition:opacity .35s,filter .35s,transform .5s cubic-bezier(.22,1.3,.36,1);overflow-wrap:anywhere}
.ll:hover{background:color-mix(in srgb,var(--text) 6%,transparent)}
.ll.now{opacity:1;transform:scale(1.025)}
.ll.past{opacity:.25}
.lyr.blur .ll.past{filter:blur(1.5px)}
.ll.right{text-align:right;transform-origin:right center}
.ll .who{display:block;font:500 11px/1.4 var(--body);letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.w{display:inline-block;white-space:pre;--p:0}
.ll.now .w{color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(90deg,var(--text) calc(var(--p)*100% - 3px),color-mix(in srgb,var(--text) 38%,transparent) calc(var(--p)*100% + 3px));
  transform:translateY(calc((1 - var(--p)) * 2px));transition:transform .2s}
.ll.now .w.long.go{filter:drop-shadow(0 0 calc(var(--p)*7px) color-mix(in srgb,var(--text) 45%,transparent))}
.bgv{display:block;font-size:.6em;margin-top:3px;opacity:.85}
.ll:not(.now) .bgv{opacity:.7}
.gap{display:flex;gap:9px;align-items:center;height:0;overflow:hidden;padding:0 12px;transition:height .35s,margin .35s}
.gap.on{height:46px;margin:4px 0}
.gap.blank{height:calc(var(--fs,28px)*.6)}   /* 段落の区切り: 待機中でなくても空きを残す */
.gap.blank.on{height:46px}
.gap.blank:not(.on) i{visibility:hidden}
.gap i{--p:0;width:11px;height:11px;border-radius:50%;background:var(--text);opacity:calc(.22 + var(--p)*.78);transform:scale(calc(.75 + var(--p)*.35));transition:opacity .2s,transform .2s}
.gap.on{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
.ul{padding:4px 10px;opacity:.9;font-size:calc(var(--fs)*.78);font-weight:500;line-height:1.7}
.ul.sp{height:.9em}
.lyr.plain{padding:12px 4px 40px;mask-image:none;-webkit-mask-image:none}
.lyrempty{height:min(54vh,540px);min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--muted);padding:0 16px}
.lyrempty b{color:var(--text);font-family:var(--display);font-size:18px}
.lyrresume{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none}
.lyrresume.show{display:inline-flex}
.lyrbar{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0}
.lyrbar .chip{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;background:var(--s2);color:var(--muted)}   /* ずれの補正と同じ地の色 */
.lyrbar .sp{flex:1}
.offc{display:inline-flex;align-items:center;background:var(--s2);border-radius:17px;height:34px}
.offc button{width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.offc button{display:grid;place-items:center}
.offc output{min-width:66px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.offc{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.offc output{cursor:pointer;touch-action:manipulation}
.mi span small{display:block;font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
/* 歌詞のタイミングの編集モード */
.lyrbar.ted{flex-direction:column;align-items:stretch;gap:6px}
.tedhead{display:flex;align-items:center;gap:8px;min-width:0}
.tedtag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:var(--pri);color:var(--on-pri);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tedrow{display:flex;justify-content:space-between;align-items:stretch;gap:4px}
.tedb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;border-radius:14px;background:var(--s2);font-size:11px;color:var(--text);min-width:0;user-select:none;-webkit-user-select:none}
.tedb span{white-space:nowrap}
.tedb.big{flex:2;background:var(--pri);color:var(--on-pri);font-size:13px;font-weight:600}
.tedb:active{filter:brightness(.92)}
.tedb:disabled{opacity:.4}
.xp.ted .ctl,.xp.ted .xbot{display:none}
.xp.wide.lyrfull .lyrbar.ted{justify-content:flex-start}
.lprev{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.4;cursor:pointer;padding:6px 12px;border-radius:14px;background:color-mix(in srgb,var(--s2) 70%,transparent);min-height:52px}
.xp.wide .lprev{font-size:15px;min-height:46px;padding:4px 12px}
.lprev .a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lprev .b{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lprev small{display:block;font:500 11px var(--body);color:var(--muted);margin-bottom:2px}
textarea.lin{width:100%;min-height:220px;border-radius:14px;border:1px solid var(--line);background:var(--s2);color:var(--text);padding:12px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
@media (prefers-reduced-motion:reduce){.ll.now{transform:none}.ll.now .w{transform:none}.lyr.blur .ll.past{filter:none}}
.xinfo{display:flex;align-items:center;gap:8px}
.xinfo .tt{flex:1;min-width:0}
.xinfo h2{font-size:22px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xinfo .sub{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xinfo .sub a{text-decoration:underline;text-decoration-color:transparent}
.xinfo .sub a:hover{text-decoration-color:currentColor}
.xchips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
/* 形式と評価を 1 段に(入りきらなければ折り返す) */
.xmeta{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.xmeta .stars{gap:0;margin-left:auto}
.xmeta .stars button{width:30px;height:30px}
.xmeta .stars svg{width:22px;height:22px}
.stars{display:flex;justify-content:center;gap:4px;color:var(--star)}
.stars button{width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.stars button.on{color:var(--star)}
.seek{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wave{flex:1;height:48px;display:flex;align-items:center;gap:2px;cursor:pointer;touch-action:none;min-width:0}
.wave i{flex:1;min-width:1px;background:var(--s3);border-radius:2px}
.wave i.on{background:var(--pri)}
.line{flex:1;height:4px;border-radius:2px;background:var(--s3);cursor:pointer;position:relative;touch-action:none}
.line::after{content:"";position:absolute;left:0;right:0;top:-12px;bottom:-12px}   /* 細い線でも押しやすく */
.line i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--pri);width:0}
.ctl{display:flex;align-items:center;justify-content:space-between}
.ctl .ib{width:52px;height:52px}
.ctl .ib.act{background:var(--pc);color:var(--on-pc)}
.xbot{display:flex;justify-content:space-around;margin-top:auto;padding-top:6px}
/* 縦の再生中画面: スクロールせずに画面に収める。ジャケット(または歌詞)が残りの高さに合わせて縮む */
.xp:not(.wide) .in{height:100%;min-height:540px;gap:10px;padding-bottom:10px}
.xp:not(.wide) .xl{display:flex;flex-direction:column;justify-content:center;gap:8px;flex:1 1 0;min-height:0;container-type:size}   /* 余った高さはジャケットの上下に分ける */
.xp:not(.wide) .xart{width:min(100cqw,calc(100cqh - var(--lp,0px)));margin:0 auto;flex:none}
.xp:not(.wide) .xl:has(.lprev:not([hidden])){--lp:62px}
.xp:not(.wide) .xl .lyrwrap,.xp:not(.wide) .xl .lyrwrap>div{flex:1 1 0;min-height:0;margin:0;display:flex;flex-direction:column}
.xp:not(.wide) .xl .lyr,.xp:not(.wide) .xl .lyrempty{flex:1 1 0;height:auto;min-height:0;box-sizing:border-box}
.xp:not(.wide) .xl .lyr:not(.plain){padding:26cqh 4px 34cqh}   /* 上下の余白は幅でなく高さに合わせる(低い画面で歌詞の枠からはみ出さない) */
.xp:not(.wide) .xbot{padding-top:0}
/* 歌詞と並べるジャケット。ふだんは出さず、縦に余裕があれば歌詞の上に、横に余裕があれば歌詞の左に置く */
.xart.xlj{display:none}
@container (min-height:640px){.xp:not(.wide):not(.ted) .xl .xart.xlj{display:block;width:min(100cqw,36cqh);flex:none}}
.xbot button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);flex:1 1 0;min-width:0;max-width:96px;padding:6px 0;white-space:nowrap}
.xbot button.on,.lfbtn.on{color:var(--pri)}
/* 再生中画面: 縦はそのまま並べる。横並び(.wide)はスマホの横向きのとき、または向きのボタンで「横」を選んだとき(PC でも) */
.xl,.xr{display:contents}
.lfbtn,.lfplay,.lfinfo,.lfseek{display:none!important}
.xp.wide .in{max-width:1500px;height:100%;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:0 28px;
  padding:8px max(20px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px))}
.xp.wide .xtop{grid-column:2;grid-row:1;width:100%;max-width:680px;justify-self:center}
.xp.wide .xl{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:0}
.xp.wide .xr{grid-column:2;grid-row:2;display:flex;flex-direction:column;justify-content:safe center;gap:8px;min-height:0;overflow:auto;scrollbar-width:none;width:100%;max-width:680px;justify-self:center}
.xp.wide .xr::-webkit-scrollbar{display:none}
.xp.wide .xart{width:min(calc(100dvh - 32px),46vw);margin:0}
.xp.wide .xl:has(.lyrwrap){width:52vw;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;align-content:stretch}
.xp.wide .xl .lyrwrap{min-height:0;margin:0}
.xp.wide .xl .lyrwrap>div{height:100%}
.xp.wide .xl .lyr,.xp.wide .xl .lyrempty{height:100%;min-height:0;box-sizing:border-box}
.xp.wide .xl .lyr:not(.plain){padding:30dvh 4px 40dvh}
.xp.wide .xbot{margin-top:0;padding-top:0}
@media (min-width:1200px) and (min-aspect-ratio:3/2){
  .xp.wide.lyron:not(.lyrfull):not(.ted) .in{max-width:none;grid-template-columns:minmax(0,1fr) clamp(340px,26vw,520px)}   /* 操作の列の幅を先に取る */
  .xp.wide:not(.lyrfull):not(.ted) .xl:has(.lyrwrap){width:auto;grid-template-columns:min(26vw,calc(100dvh - 64px)) minmax(0,1fr);column-gap:28px}
  .xp.wide:not(.lyrfull):not(.ted) .xl .xart.xlj{display:block;grid-column:1;grid-row:1/3;align-self:center;width:100%}
  .xp.wide:not(.lyrfull):not(.ted) .xl .lyrwrap,.xp.wide:not(.lyrfull):not(.ted) .xl .lyrbar{grid-column:2}
}
/* 歌詞だけを表示: 操作パネルを隠して歌詞を中央に大きく */
.xp.wide.lyrfull .lfbtn,.xp.wide.lyrfull .lfplay{display:grid!important}
.xp.wide.lyrfull .lfinfo{display:block!important;min-width:0;flex:0 1 auto;max-width:45%;line-height:1.3}
.lfinfo b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lfinfo small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp.wide.lyrfull .in{padding-bottom:14px}
/* 全画面の歌詞バー: 曲名・歌詞の種類・ずれの補正・ボタン群を、画面の幅に均等に並べる */
.lfgrp{display:contents}
.xp.wide.lyrfull .lfgrp{display:flex;align-items:center;gap:4px;flex:none}
.xp.wide.lyrfull .lyrbar{justify-content:space-between}
.xp.wide.lyrfull .lyrbar>.sp{display:none}
/* 進み具合の線: 時間は出さず、画面の下の縁に横いっぱい */
.xp.wide.lyrfull .lfseek{display:block!important;position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);z-index:2}
.lft{display:none}
.lftrack{position:relative;height:16px;cursor:pointer;touch-action:none}
.lftrack::before{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:color-mix(in srgb,var(--text) 22%,transparent)}
.lftrack i{position:absolute;left:0;bottom:0;height:4px;background:var(--pri);width:0}
.lftrack b{display:none}   /* つまみは出さず、線だけにする */
.xp.wide.lyrfull .in{grid-template-columns:minmax(0,1fr)}
.xp.wide.lyrfull .xtop,.xp.wide.lyrfull .xr{display:none}
.xp.wide.lyrfull .xl:has(.lyrwrap){width:auto}
.xp.wide.lyrfull .lyr{--fs:clamp(30px,10dvh,56px);padding-left:max(24px,4vw);padding-right:max(24px,4vw)}
.xp.wide.lyrfull .lyr.fs-s{--fs:clamp(24px,8dvh,46px)} .xp.wide.lyrfull .lyr.fs-l{--fs:clamp(36px,12dvh,68px)}
.xp.wide.lyrfull .ll{text-align:center;transform-origin:center}
.xp.wide.lyrfull .gap{justify-content:center}
/* 歌詞を出しているとき(通常・全画面とも): 画面の背景にジャケットをぼかして敷く */
.xp.lyron::before{background:var(--xbg);filter:blur(6px) saturate(1.15);transform:scale(1.04);opacity:.5;animation:none;position:fixed}   /* fixed: 少し拡大した背景で画面がスクロールできてしまわないように */
:root[data-theme="dark"] .xp.lyron::before{opacity:.55}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .xp.lyron::before{opacity:.55}}
/* ジャケットが見える分、歌詞・曲名・ボタンに背景色のふちを付けて読みやすくする */
.xp.lyron .lyr{filter:drop-shadow(0 0 3px var(--bg)) drop-shadow(0 0 10px var(--bg))}
.xp.lyron .lfinfo,.xp.lyron .xinfo,.xp.lyron .xtop .ctx,.xp.lyron .seek,.xp.lyron .xbot{filter:drop-shadow(0 0 4px var(--bg))}
.xp.wide.lyrfull .in{overflow:hidden;isolation:isolate}
/* 低い画面(スマホの横向き)では操作を小さめに */
@media (max-height:600px){
  .xp.wide .xinfo h2{font-size:19px}
  .xp.wide .stars button{width:30px;height:30px}
  .xp.wide .wave{height:36px}
  .xp.wide .ctl .ib{width:44px;height:44px}
}
/* アプリとして開いた横向き(上下にシステムの帯があり 300px 前後しかない)ではさらに詰める */
@media (max-height:360px){
  .xp.wide .in{padding-top:4px;padding-bottom:4px}
  .xp.wide .xart{width:min(calc(100dvh - 16px),46vw)}
  .xp.wide .xtop .ib{width:36px;height:36px}
  .xp.wide .xtop .ctx small{display:none}
  .xp.wide .xr{gap:4px}
  .xp.wide .xinfo h2{font-size:17px;line-height:1.25}
  .xp.wide .xinfo .sub{font-size:13px}
  .xp.wide .xinfo .ib{width:36px;height:36px}
  .xp.wide .xchips{display:none}
  .xp.wide .stars button{width:26px;height:26px}
  .xp.wide .stars svg{width:20px;height:20px}
  .xp.wide .wave{height:28px}
  .xp.wide .ctl .ib{width:40px;height:40px}
  .xp.wide .xbot button{padding:2px 6px;font-size:10px}
}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--s1);border-radius:28px 28px 0 0;max-height:82%;display:none;flex-direction:column;padding:8px 8px calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.sheet.open{display:flex}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sheet .sh{display:flex;align-items:center;padding:0 8px 6px;gap:8px}
.sheet .sh h2{font-size:18px;flex:1}
.sheet .body{overflow:auto;min-height:0}
/* プロパティ(タグの表示・編集) */
.props .seg{padding:0 8px 8px}
.props .form textarea,.props .tg textarea{background:var(--s2);border:1px solid transparent;border-radius:12px;padding:8px 10px;color:var(--text);font:inherit;width:100%;resize:vertical;min-height:40px}
.props .form input:focus,.props textarea:focus{outline:none;border-color:var(--pri)}
.props .tg{display:grid;grid-template-columns:minmax(90px,30%) minmax(0,1fr);gap:6px 10px;padding:12px 16px;align-items:start}
.props .tg code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding-top:10px;overflow-wrap:anywhere;color:var(--muted)}
.props .tg .ro{padding:8px 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.props .tg input{background:var(--s2);border:1px solid transparent;border-radius:12px;padding:8px 10px;color:var(--text);font:12px ui-monospace,Menlo,Consolas,monospace}
.props .note{margin:0 16px 8px;font-size:13px;color:var(--muted)}
.props .warn{margin:0 16px 8px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--text);font-size:13px}
.props .cov{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:12px 16px}
.props .cov img,.props .cov .none{width:min(240px,60vw);aspect-ratio:1;object-fit:cover;border-radius:16px;background:var(--s2);display:grid;place-items:center;color:var(--muted)}
.props .acts{display:flex;flex-direction:column;gap:8px}
.props .hist{margin:4px 8px 8px}

.mi{display:flex;align-items:center;gap:16px;padding:12px 14px;border-radius:14px;width:100%;text-align:left}
.mi:hover{background:var(--s2)}
.mi svg{color:var(--muted)}
.qrow{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:6px 6px;border-radius:12px;background:transparent}
.qrow .cover{width:44px;border-radius:10px}
.qrow.cur{background:var(--pc);color:var(--on-pc)}
.qrow.over{box-shadow:0 -2px 0 var(--pri)}
.qrow .tt{min-width:0}
.qrow .tt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .tt small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.qrow.cur small{color:inherit;opacity:.8}
.qrow .grip{cursor:grab;color:var(--muted)}
.mv{display:none}
@media (pointer:coarse){.mv{display:grid}.qrow .grip{display:none}.qrow{grid-template-columns:44px minmax(0,1fr) auto auto auto}}

.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:14px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.authv{position:fixed;inset:0;z-index:70;display:grid;place-items:center;overflow:auto;padding:20px;background:radial-gradient(circle at 50% 30%,#123a5c 0,#07192b 52%,#030a12 100%);color:#fff}
.authv[hidden]{display:none}
.auth-card{display:flex;flex-direction:column;gap:14px;width:min(360px,100%)}
.auth-card h1{font-size:19px;margin:0;text-align:center}.auth-card p{margin:0;font-size:13px;color:#a8d4f2;line-height:1.6}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:6px}.auth-logo b{font-size:24px;letter-spacing:.3em;margin-right:-.3em}
.auth-names{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.auth-names .chip{background:rgba(255,255,255,.12);color:#fff;border:0;min-height:44px;padding:0 18px;font-size:15px;border-radius:22px;cursor:pointer}
.auth-names .chip[aria-checked="true"]{background:#fff;color:#07304d;font-weight:600}
.auth-card label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#cfe6f7}
.auth-card input{min-height:46px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:16px}
.auth-card input:focus{outline:2px solid #3db4ff;outline-offset:1px}
.auth-card .btn{min-height:46px;justify-content:center;background:#1d8fd6;color:#fff}
.auth-card .btn:disabled{opacity:.6}
.auth-err{color:#ffb4ab!important;min-height:20px;text-align:center}
/* ロード画面: 動かすのは transform と opacity だけ */
.splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#123a5c 0,#07192b 48%,#030a12 100%);color:#fff;opacity:0;transition:opacity .16s ease;pointer-events:none}
.splash[hidden]{display:none}
.splash.boot,.splash.show{opacity:1;pointer-events:auto}
.splash.off{opacity:0;transition:opacity .4s ease}
.splash.off .spl-in{transform:scale(1.14);transition:transform .4s cubic-bezier(.3,0,.2,1)}
.spl-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;will-change:transform}
.spl-stage{position:relative;width:188px;height:188px}
.spl-wave{position:absolute;inset:0;border-radius:50%;border:2px solid #3db4ff;opacity:0;will-change:transform,opacity;animation:splwave 2.4s cubic-bezier(.2,.5,.3,1) infinite}
.spl-wave:nth-child(2){animation-delay:.8s}.spl-wave:nth-child(3){animation-delay:1.6s}
@keyframes splwave{0%{transform:scale(.55);opacity:.75}100%{transform:scale(1.75);opacity:0}}
.spl-ring{position:absolute;inset:4px;border-radius:50%;background:conic-gradient(from 0deg,rgba(61,180,255,0) 0 55%,#3db4ff 85%,#fff 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));will-change:transform;animation:splspin 1.15s linear infinite}
@keyframes splspin{to{transform:rotate(360deg)}}
.spl-logo{position:absolute;inset:30px;display:block;width:128px;height:128px;will-change:transform;animation:splfloat 2.4s ease-in-out infinite}
@keyframes splfloat{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.spl-bars{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-5px 0 0 -23px;display:flex;align-items:flex-end;justify-content:space-between}
.spl-bars i{display:block;width:7px;height:100%;border-radius:4px;background:#fff;transform-origin:bottom;will-change:transform;animation:splbar .82s ease-in-out infinite alternate}
.spl-bars i:nth-child(1){animation-delay:-.1s}.spl-bars i:nth-child(2){animation-delay:-.55s}.spl-bars i:nth-child(3){animation-delay:-.3s}.spl-bars i:nth-child(4){animation-delay:-.72s}
@keyframes splbar{from{transform:scaleY(.22)}to{transform:scaleY(1)}}
.spl-name{font-size:30px;font-weight:700;letter-spacing:.32em;margin-right:-.32em;animation:splname .7s ease-out both}
@keyframes splname{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.spl-msg{min-height:20px;font-size:14px;color:#a8d4f2;text-align:center}
.splash.quick{background:rgba(3,10,18,.78)}
.splash.quick .spl-name,.splash.quick .spl-msg:empty{display:none}
.splash.quick .spl-stage{transform:scale(.72)}
/* エフェクト */
.fds{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;padding:14px 8px 8px}
.fd{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.fd output{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.fd small{font-size:11px;color:var(--muted);white-space:nowrap}
.fdw{position:relative;display:block;width:28px;height:150px}
.fdw input{position:absolute;left:50%;top:50%;width:150px;height:28px;margin:0;transform:translate(-50%,-50%) rotate(-90deg);accent-color:var(--pri)}
.fxuser-del[hidden]{display:none}
.fxg{padding:8px 14px 12px}.fxg>small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
/* ビジュアライザー */
.viz{position:fixed;inset:0;z-index:50;background:#04090f;display:none;color:#fff;overflow:hidden}
.viz.open{display:block}
.viz canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#vizart{display:none;position:absolute;left:50%;top:50%;width:min(44vw,44vh);height:min(44vw,44vh);border-radius:50%;transform:translate(-50%,-50%);will-change:transform;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.vizui{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:20px calc(20px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) calc(20px + env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .3s;pointer-events:none}
.viz.ui .vizui{opacity:1;pointer-events:auto}
#vizcap{min-width:0}#vizcap b{display:block;font-size:clamp(17px,3vmin,30px);font-weight:600}#vizcap small{display:block;font-size:clamp(13px,2vmin,18px);opacity:.8}
.vizbtns{display:flex;align-items:center;gap:8px;flex:none}
.vizbtns button{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;justify-content:center;padding:0 14px;border-radius:22px;background:rgba(255,255,255,.14);color:#fff;font:inherit;border:0;cursor:pointer}
.vizbtns button:focus-visible{outline:2px solid #fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function spread(ids){ // 同じアーティスト・アルバムが続かないように並べる
  const out=[],rest=ids.slice();
  while(rest.length){
    const l=out.length?SONGS[out[out.length-1]]:null;
    let i=rest.findIndex(id=>!l||(alOf(SONGS[id]).a!==alOf(l).a&&SONGS[id].al!==l.al));
    if(i<0)i=rest.findIndex(id=>!l||SONGS[id].al!==l.al);
    if(i<0)i=0;
    out.push(rest.splice(i,1)[0]);
  }

}
function wsample(items,w,n){
  const out=[],pool=items.slice();
  while(out.length<n&&pool.length){
    let tot=0;for(const i of pool)tot+=w(i);
    let r=Math.random()*tot,k=0;for(;k<pool.length;k++){r-=w(pool[k]);if(r<=0)break;}
    if(k>=pool.length)k=pool.length-1;out.push(pool.splice(k,1)[0]);
  }
  return out;
}

/* folders */
function buildFS(){
  const root=[];
  for(const src of SRCS){
    if(!st.src[src.id])continue;
    const top={n:src.name,src:src.path,d:[]},idx=new Map();
    const dirOf=parts=>{let node=top,key='';for(const p of parts){key+='/'+p;let nx=idx.get(key);if(!nx){nx={n:p,d:[]};idx.set(key,nx);node.d.push(nx);}node=nx;}return node;};
    SONGS.forEach(s=>{if(s.src!==src.id)return;const parts=s.rel.split('/'),file=parts.pop();dirOf(parts).d.push({n:file,s:s.id,f:s.fmt||alOf(s).f,sz:fmtT(s.d)});});
    const sort=n=>{if(!n.d)return;n.d.sort((a,b)=>(!!b.d-!!a.d)||a.n.localeCompare(b.n,'ja',{numeric:true}));n.d.forEach(sort);};sort(top);
    root.push(top);
  }
  return {n:'ルート',d:root};
}

function setLyr(id,o){const p=lyrCache.get(id);o.v=((p&&p.v)||0)+1;if(p&&p.autoTried)o.autoTried=true;lyrCache.set(id,o);return o;}

async function lyrRequest(id,method='GET',path='',body){
  if(SONGS[id]&&SONGS[id].local)return localLyrics(SONGS[id],method,path,body);
  if(LYR_API!==null){
    const opt={method,headers:{}};
    if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
    const r=await fetch(`${LYR_API}/api/tracks/${encodeURIComponent((SONGS[id]&&SONGS[id].dbid)||id)}/lyrics${path}`,opt);
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||('HTTP '+r.status));}
    return r.json();
  }
  /* --- モック: サーバーと同じ応答の形を返す --- */
  await new Promise(r=>setTimeout(r,method==='GET'?120:700));
  const m=lyrMock.get(id)||{offsetMs:0,manual:null,lrclib:null,miss:false};lyrMock.set(id,m);
  if(method==='PUT'&&path==='/offset')m.offsetMs=Math.max(-10000,Math.min(10000,body.offsetMs|0));
  if(method==='PUT'&&path===''){m.prev={manual:m.manual,offsetMs:m.offsetMs};m.manual=parseLyricsText(body.text,'manual',SONGS[id].d*1000);if(body.offsetMs!=null)m.offsetMs=body.offsetMs;}
  if(method==='DELETE'){m.prev={manual:m.manual,offsetMs:m.offsetMs};m.manual=null;}
  if(method==='POST'&&path==='/restore'&&m.prev){m.manual=m.prev.manual;m.offsetMs=m.prev.offsetMs;m.prev=null;}
  if(method==='POST'&&path==='/fetch'){if(DEMO_LRCLIB_HIT.includes(+id)){m.lrclib=DEMO_LYRICS[id];m.miss=false;}else m.miss=true;}
  const local=(DEMO_LYRICS[id]&&DEMO_LYRICS[id].source!=='lrclib')?DEMO_LYRICS[id]:null;
  const ly=m.manual||local||m.lrclib;
  return {trackId:id,available:!!ly,lyrics:ly,offsetMs:m.offsetMs,canFetch:true,lrclibMiss:m.miss,hasPrev:!!m.prev};
}
function loadLyrics(id,force){
  const c=lyrCache.get(id);
  if(c&&!force&&c.state!=='error')return;
  setLyr(id,{state:'loading',data:c&&c.data});
  lyrRequest(id).then(d=>{
    const o=setLyr(id,{state:'ready',data:d});
    // 手元に無い曲は、設定がオンなら 1 回だけ自動で LRCLIB を探す
    if(!d.available&&d.canFetch&&!d.lrclibMiss&&st.set.np_lyrfetch&&!o.autoTried){o.autoTried=true;lyrFetch(id,true);}
    lyrUpdated(id);
  }).catch(e=>{setLyr(id,{state:'error',err:String(e.message||e)});lyrUpdated(id);});
}
function lyrFetch(id,quiet){
  const c=lyrCache.get(id);setLyr(id,{state:'loading',data:c&&c.data,fetching:true});lyrUpdated(id);
  lyrRequest(id,'POST','/fetch').then(d=>{setLyr(id,{state:'ready',data:d});lyrUpdated(id);
    if(!quiet)toast(d.available&&d.lyrics.source==='lrclib'?'LRCLIB から歌詞を取得しました':d.available?'手元の歌詞を表示しています':'LRCLIB にも見つかりませんでした');})
   .catch(e=>{setLyr(id,{state:'ready',data:c&&c.data});lyrUpdated(id);toast('歌詞を取得できませんでした: '+(e.message||e));});
}
function lyrSave(id,method,path,body,msg){
  return lyrRequest(id,method,path,body).then(d=>{setLyr(id,{state:'ready',data:d});lyrUpdated(id);if(msg)toast(msg);})
    .catch(e=>toast('保存できませんでした: '+(e.message||e)));
}
function lyrUpdated(id){const s=cur();lyrPrevKey=null;if(s&&s.id===id&&st.xp&&st.lyr)renderXP();}

/* --- 表示の組み立て --- */
const clamp01=x=>x<0?0:x>1?1:x;
function bsearch(lines,t){let lo=0,hi=lines.length-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(lines[m].start<=t){r=m;lo=m+1;}else hi=m-1;}return r;}
let lyrDom=null,lyrPrevKey=null;
// 時刻の無い歌詞に、曲の長さと行の長さ(文字数)から時刻を割り当てる(推定)。
// 前奏・後奏は曲の長さの 8%・6%(8〜25 秒・5〜20 秒)と見なし、空行(段落の切れ目)には 1 行分の間を空ける
function estimateTimes(main,durMs){
  const W=t=>2+[...t].reduce((a,ch)=>a+(ch<'\x80'?.5:1),0);
  const items=[];
  main.lines.forEach(l=>{if(l.text)items.push({text:l.text,w:W(l.text)});else if(items.length&&!items[items.length-1].gap)items.push({gap:true,w:0});});
  while(items.length&&items[items.length-1].gap)items.pop();
  const ws=items.filter(x=>!x.gap),avg=ws.reduce((a,x)=>a+x.w,0)/Math.max(1,ws.length);
  items.forEach(x=>{if(x.gap)x.w=avg;});
  const t0=Math.min(25000,Math.max(8000,durMs*.08)),t1=durMs-Math.min(20000,Math.max(5000,durMs*.06));
  const span=Math.max(1000,t1-t0),total=items.reduce((a,x)=>a+x.w,0)||1;
  let t=t0;const lines=[];
  items.forEach(x=>{const d=span*x.w/total;lines.push(x.gap?{start:Math.round(t),end:Math.round(t+d),text:''}:{start:Math.round(t),end:Math.round(t+d*.92),text:x.text});t+=d;});
  return {...main,synced:true,estimated:true,lines};
}
// 表示に使う歌詞(main)。時刻が無く、推定が有効なら推定した時刻つきを返す
const lyrMain=(s,ly)=>{if(ted&&ted.kind==='line'&&ted.id===s.id)return ted.main;
  const m=ly&&ly.layers&&ly.layers.find(l=>l.kind==='main');
  if(!m||m.synced||!st.set.np_lyrest||!m.lines.some(l=>l.text))return m;
  if(!m._est||m._est.d!==s.d)m._est={d:s.d,v:estimateTimes(m,s.d*1000)};
  return m._est.v;};
// ---- 歌詞のタイミングの編集モード(タイミング調整のエリアを長押し、または歌詞のメニューから入る) ----
// ふだんの ↑↓ はその場だけの表示の調整(保存しない)。保存するのは編集モードの中だけにして、知らずに押しても壊れないようにする。
//   kind 'off' : 全体のずれ(出だしの位置)だけを調整して保存。行の間隔はそのまま
//   kind 'line': 曲を最初から流し、「次の行」を押した時刻を行の始まりとして記録する。押すまで次の行へ進まない。
//                「ここから間奏」で今の行を終わらせる。保存すると「手動登録」の LRC になり、前の版に 1 回戻せる
let ted=null,tmpOff=null;   // tmpOff={id,ms}: その場だけの調整。曲が変わったら消える
const FAR=1e12;
const lyrMine=s=>LIVE&&!isAdmin()&&!s.local;   // 家族の編集は、その人だけの修正として保存される
const tedDraftKey=s=>'otokura.lyrdraft.'+(AUTH.user&&!s.local?AUTH.user.id+'.':'')+(s.dbid||s.id);
const sungTexts=L=>L.filter(l=>l.text).map(l=>l.text).join('\n');
function tedDraft(s,L){try{const d=JSON.parse(localStorage.getItem(tedDraftKey(s)));return d&&d.src&&d.k>=0&&sungTexts(d.src)===sungTexts(L)?d:null;}catch(e){return null;}}
function tedLines(s,c){const m=lyrMain(s,c.data.lyrics);if(!m||!m.lines.some(l=>l.text))return null;
  const L=m.lines.filter((l,i,a)=>l.text||(a[i-1]&&a[i-1].text));while(L.length&&!L[L.length-1].text)L.pop();   // 先頭・末尾・連続の区切りは外す
  return L;}
function tedEnter(kind,resume){
  const s=cur(),c=lyrCache.get(s.id);closeSheet();if(!c||!c.data)return;
  const L=tedLines(s,c);if(!L){toast('この曲の歌詞はありません');return;}
  const back={lyr:st.lyr,full:st.lyrFull};st.lyr=true;if(isWide())st.lyrFull=true;
  if(kind==='off'){ted={kind,id:s.id,v:lyrOffset(s.id),back};tmpOff=null;}
  else{
    const dr=resume&&tedDraft(s,L);
    ted={kind,id:s.id,src:dr?dr.src:L,t:dr?dr.t:L.map(()=>null),e:dr?dr.e:L.map(()=>null),k:dr?dr.k:-1,v:0,back};
    ted.main=tedMain();st.pos=dr?Math.max(0,ted.t[ted.k]/1000-3):0;tmpOff=null;
    if(!st.playing)setPlaying(true);else updateProg();
  }
  lyrPrevKey=null;renderXP();
}
function tedExit(){if(!ted)return;const b=ted.back;ted=null;st.lyr=b.lyr;st.lyrFull=b.full;lyrPrevKey=null;renderXP();}
function tedMain(){
  const r=ted;
  const tx=l=>l.text||'␣';   // 編集中は空白行を ␣ で見せる(光っていれば、そこで待機中)
  const lines=r.src.map((l,i)=>{const t=r.t[i];if(t==null)return {start:FAR,end:FAR,text:tx(l)};
    return {start:t,end:r.e[i]!=null?r.e[i]:r.t[i+1]!=null?r.t[i+1]:FAR-1,text:tx(l)};});   // 今の行は次を押すまで光らせたまま
  return {kind:'main',synced:true,edit:true,lines};
}
function tedChanged(){const r=ted;r.main=tedMain();r.v++;
  try{localStorage.setItem(tedDraftKey(SONGS[r.id]),JSON.stringify({src:r.src.map(l=>({start:l.start,end:l.end,text:l.text})),t:r.t,e:r.e,k:r.k}));}catch(e){}
  lyrPrevKey=null;renderXP();}
function tedNext(){
  const r=ted,now=Math.round(st.pos*1000),N=r.src.length;
  while(r.k>=0&&r.t[r.k]>now){r.t[r.k]=null;r.e[r.k]=null;r.k--;}   // 戻って押したら、そこから記録し直す
  if(r.k>=0&&r.e[r.k]!=null&&r.e[r.k]>now)r.e[r.k]=null;
  if(r.k>=N-1){toast('最後の行まで記録しました。「保存」を押してください');return;}
  r.k++;r.t[r.k]=now;r.e[r.k]=null;tedChanged();
}
function tedGap(){const r=ted,now=Math.round(st.pos*1000);if(r.k<0||now<=r.t[r.k])return;r.e[r.k]=now;tedChanged();}
const tedNextBlank=()=>ted.src.findIndex((l,i)=>i>ted.k&&!l.text);
function tedDelBlank(){const r=ted,j=tedNextBlank();if(j<0){toast('この先に空白行はありません');return;}
  r.src=r.src.slice();[r.src,r.t,r.e].forEach(a=>a.splice(j,1));tedChanged();}
function tedUndo(){const r=ted;if(r.k<0)return;r.t[r.k]=null;r.e[r.k]=null;r.k--;tedChanged();}
function tedSave(){
  const r=ted,s=SONGS[r.id];
  if(r.kind==='off'){const v=r.v;tedExit();lyrSave(s.id,'PUT','/offset',{offsetMs:v},lyrMine(s)?'歌詞のずれを保存しました(あなただけに効きます)':'歌詞のずれを保存しました');return;}
  const L=r.src,N=L.length,k=r.k,t=r.t.slice(),e=r.e.slice();
  if(k<0){toast('まだ 1 行も記録していません');return;}
  if(k<N-1){   // 押していない行は、最後の記録から曲の終わりまでに元の間隔を伸び縮みさせて埋める
    const a=e[k]!=null?e[k]:t[k],a0=L[k].start,end=Math.max(a+(N-k)*1000,(s.d||0)*1000-5000),sc=(end-a)/Math.max(1,L[N-1].end-a0);
    for(let i=k+1;i<N;i++)t[i]=Math.max(t[i-1]+100,Math.round(a+(L[i].start-a0)*sc));}
  const f=ms=>`[${String(Math.floor(ms/60000)).padStart(2,'0')}:${(ms%60000/1000).toFixed(2).padStart(5,'0')}]`;
  const text=t.map((ms,i)=>f(ms)+L[i].text+(e[i]!=null?'\n'+f(e[i]):'')).join('\n');   // 空の行 = そこで前の行が終わる(間奏)
  try{localStorage.removeItem(tedDraftKey(s));}catch(err){}
  tedExit();lyrSave(s.id,'PUT','',{text,offsetMs:0},lyrMine(s)?'行ごとのタイミングを保存しました(あなただけに効きます。メニューから戻せます)':'行ごとのタイミングを保存しました(メニューから前の版に戻せます)');
}
function tedCancel(){
  const r=ted;if(!r)return;tedExit();
  toast(r.kind==='line'&&r.k>=0?'編集をやめました。書きかけは残しているので、続きから記録できます':'編集をやめました(保存していません)');
}
function tedSheet(){
  const s=cur(),c=lyrCache.get(s.id),d=c&&c.data,ly=d&&d.lyrics;
  const L=d&&ly&&tedLines(s,c),m=L&&lyrMain(s,ly),dr=L&&tedDraft(s,L);
  const opt=(act,icon,b,sm,attrs='')=>`<button class="mi" data-act="${act}" ${attrs}>${ico(icon,22)}<span><b>${b}</b><small>${sm}</small></span></button>`;
  openSheet('ted','歌詞のタイミングを編集',!L?`<p class="muted" style="margin:4px 14px 12px">この曲の歌詞はありません</p>`
    :(m.synced?opt('tedOff','sort','出だしの位置だけ調整','歌詞全体を同じだけ早く・遅くして保存します。行どうしの間隔はそのままです'):'')
    +opt('tedLine','lyrics','行ごとにタイミングを記録','曲を最初から流し、歌に合わせて「次の行」を押して 1 行ずつ記録します'+(ly.hasWords?'。<b style="color:var(--err)">語ごとの同期は消えます</b>':''))
    +(dr?opt('tedLine','refresh','書きかけの続きから記録',`${dr.k+1} / ${dr.src.length} 行まで記録しています`,'data-resume="1"'):'')
    +(d.hasPrev?mi('tedRestore','back','記録・登録する前の歌詞に戻す'):''));
}
function lyrEmpty(html){const r=document.createElement('div');r.innerHTML=`<div class="lyrempty">${html}</div>`;return {root:r,synced:false};}
function buildLyrics(s,c,key){
  const d=c.data,ly=d&&d.lyrics,main=lyrMain(s,ly);
  let o;
  if(c.state==='loading'&&!ly)o=lyrEmpty(`<b>${c.fetching?'LRCLIB で探しています…':'歌詞を読み込んでいます…'}</b>`);
  else if(c.state==='error')o=lyrEmpty(`<b>歌詞を読み込めませんでした</b><span>${esc(c.err||'')}</span><button class="btn tonal sm" data-act="lyrReload">${ico('refresh',18)}もう一度読み込む</button>`);
  else if(ly&&ly.instrumental)o=lyrEmpty(`${ico('note',40)}<b>インストゥルメンタルの曲です</b>`);
  else if(!main||!main.lines.some(l=>l.text))o=lyrEmpty(`${ico('lyrics',40)}<b>この曲の歌詞はありません</b>
      <span>${d&&d.lrclibMiss?'LRCLIB にも見つかりませんでした。':'同じフォルダの .lrc / .ttml、またはタグから読み込みます。'}</span>
      <span style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${d&&d.canFetch?`<button class="btn tonal sm" data-act="lyrFetch">${ico('search',18)}LRCLIB で探す</button>`:''}${isAdmin()||cur().local?`<button class="btn ghost sm" data-act="lyrPaste">${ico('add',18)}貼り付ける</button>`:''}</span>`);
  else if(!main.synced){
    const r=document.createElement('div');
    r.innerHTML=`<div class="lyr plain fs-${{小:'s',中:'m',大:'l'}[st.set.np_lyrsize]||'m'}" tabindex="0" aria-label="歌詞(同期なし)">${main.lines.map(l=>l.text?`<div class="ul">${esc(l.text)}</div>`:'<div class="ul sp"></div>').join('')}</div>`;
    o={root:r,synced:false};
  }else o=buildSynced(main);
  o.id=s.id;o.key=key;return o;
}
// 空の行(段落の区切り)は、次の行までの「待機の行」として間奏と同じ ・・・ で出す(長さ 0 なら空きだけ)
function buildSynced(main){
  const sung=l=>!!(l&&(l.text||(l.bg&&l.bg.length)));
  const A=main.lines.filter((l,i,a)=>sung(l)||(i>0&&i<a.length-1)),agents=main.agents||[];
  const L=A.filter(sung);
  const ids=[...new Set(L.map(l=>l.agent).filter(Boolean))];
  const right=a=>ids.length>1&&a&&a!=='v1'&&a!=='v1000'&&(agents.find(x=>x.id===a)||{}).role!=='main';
  const wspan=w=>`<span class="w${w.end-w.start>=1200?' long':''}">${esc(w.text)}</span>`;
  const gaps=[];let html='';
  const gapHtml=(s,e,blank)=>{gaps.push({s,e});return `<div class="gap${blank?' blank':''}" data-gi="${gaps.length-1}" aria-hidden="true"><i></i><i></i><i></i></div>`;};
  if(L.length&&L[0].start>=5000)html+=gapHtml(0,L[0].start);
  let prevAgent=null,i=-1;
  A.forEach((l,ai)=>{
    if(!sung(l)){if(sung(A[ai-1])&&sung(A[ai+1]))html+=gapHtml(l.start,l.end,true);return;}
    i++;
    const ag=agents.find(a=>a.id===l.agent);
    const who=ag&&ag.name&&l.agent!==prevAgent?`<span class="who">${esc(ag.name)}</span>`:'';prevAgent=l.agent;
    const body=l.words&&l.words.length?l.words.map(wspan).join(''):esc(l.text);
    const bg=l.bg&&l.bg.length?`<span class="bgv">${l.bg.map(wspan).join('')}</span>`:'';
    html+=`<div class="ll${right(l.agent)?' right':''}" data-act="lyrSeek" data-ms="${l.start}" data-li="${i}">${who}${body}${bg}</div>`;
    const nx=A[ai+1];if(sung(nx)&&nx.start-l.end>=5000)html+=gapHtml(l.end,nx.start);
  });
  const r=document.createElement('div');
  const fs={小:'s',中:'m',大:'l'}[st.set.np_lyrsize]||'m';
  r.innerHTML=`<div class="lyr fs-${fs} ${st.set.np_lyrblur?'blur':''}" style="position:relative" tabindex="0" aria-label="歌詞。行を押すとその位置から再生します">${html}</div>
    <button class="btn tonal sm lyrresume" data-act="lyrResume">${ico('down',18)}再生位置に戻る</button>`;
  const box=r.firstElementChild,lineEls=[...box.querySelectorAll('.ll')],gapEls=[...box.querySelectorAll('.gap')];
  const o={root:r,box,synced:true,cur:-2,active:-2,target:null,userAt:-1e9,
    lines:L.map((l,i)=>({...l,el:lineEls[i],wEls:[...lineEls[i].querySelectorAll(':scope > .w')],bEls:[...lineEls[i].querySelectorAll('.bgv .w')]})),
    gaps:gaps.map((g,i)=>({...g,el:gapEls[i],dots:[...gapEls[i].children],on:false}))};
  const mark=()=>{o.userAt=performance.now();};
  box.addEventListener('wheel',mark,{passive:true});box.addEventListener('touchmove',mark,{passive:true});
  box.addEventListener('pointermove',e=>{if(e.buttons)mark();});
  box.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End'].includes(e.key))mark();});
  return o;
}
function mountLyrics(){
  const slot=$('#lyrslot'),s=cur();if(!slot||!s)return;
  const c=lyrCache.get(s.id)||{state:'loading',v:0};
  const key=`${s.id}:${c.v||0}:${st.set.np_lyrsize}:${st.set.np_lyrblur}:${st.set.np_lyrest}:${ted&&ted.id===s.id&&ted.kind==='line'?ted.v:'-'}`;
  if(!lyrDom||lyrDom.key!==key)lyrDom=buildLyrics(s,c,key);
  slot.appendChild(lyrDom.root);
  if(lyrDom.synced){lyrDom.cur=-2;lyrDom.active=-2;lyrDom.target=null;lyrDom.userAt=-1e9;syncLyrics(lyrNow(s),true);}
}
// ずれ: 保存した値 + その場だけの調整。編集中は編集している値(行ごとの記録中は 0)
const lyrOffset=id=>{if(ted&&ted.id===id)return ted.kind==='off'?ted.v:0;
  const c=lyrCache.get(id);return ((c&&c.data&&c.data.offsetMs)||0)+(tmpOff&&tmpOff.id===id?tmpOff.ms:0);};
const lyrNow=s=>st.pos*1000+lyrOffset(s.id);   // + は歌詞を早く出す(LRC の offset と同じ向き)
function setP(el,p){const v=Math.round(p*100)/100;if(el._p!==v){el._p=v;el.style.setProperty('--p',v);el.classList.toggle('go',v>0);}}
function syncLyrics(t,jump){
  const o=lyrDom,L=o.lines;if(!L.length)return;
  const ci=bsearch(L,t),ai=ci>=0&&t<L[ci].end?ci:-1;
  if(ci!==o.cur||ai!==o.active){
    L.forEach((l,i)=>{const now=i===ai,past=!now&&i<=ci;l.el.classList.toggle('now',now);l.el.classList.toggle('past',past);l.el.classList.toggle('next2',!now&&!past&&i>ci+1);
      if(!now){l.wEls.forEach(w=>setP(w,0));l.bEls.forEach(w=>setP(w,0));}});
    o.cur=ci;o.active=ai;
  }

function parseTTMLjs(text,source,trackMs){

    if(ch.nodeType===1&&ch.localName==='span'){if(role(ch)==='x-bg')continue;const b=pt(ch.getAttribute('begin'));if(b==null){walk(ch,into);continue;}into.push({start:b,end:pt(ch.getAttribute('end'))||0,text:ch.textContent});}

    const words=[],bg=[];walk(p,words);
    for(const sp of p.getElementsByTagNameNS('*','span'))if(role(sp)==='x-bg'){const b=[];walk(sp,b);bg.push(...b);}

    if(!tx&&!bg.length)continue;

}

function updateProg(){
  const s=cur();if(!s)return;const p=Math.min(1,st.pos/s.d);
  const m=$('#mpb');if(m)m.style.width=(p*100)+'%';
  const bars=document.querySelectorAll('#wave i'),w=$('#wave');
  if(w&&w.classList.contains('wave')){const n=Math.round(p*bars.length);bars.forEach((b,i)=>b.classList.toggle('on',i<n));}
  const l=$('#lnf');if(l)l.style.width=(p*100)+'%';
  if(w)w.setAttribute('aria-valuenow',Math.round(st.pos));
  const t=$('#tcur');if(t)t.textContent=fmtT(st.pos);
  const lf=$('#lff');if(lf){lf.style.width=(p*100)+'%';$('#lfk').style.left=(p*100)+'%';$('#lfcur').textContent=fmtT(st.pos);$('#lftrack').setAttribute('aria-valuenow',Math.round(st.pos));}
}
function markPlaying(){
  const s=cur();if(!s)return;
  document.querySelectorAll('[data-song]').forEach(e=>{const on=+e.dataset.song===s.id;e.classList.toggle('is-playing',on);const no=e.querySelector('.no');if(no){no.innerHTML=on&&st.playing?ico('vol',18):SONGS[+e.dataset.song].n;}});
  document.querySelectorAll('[data-alb]').forEach(e=>e.classList.toggle('is-playing',+e.dataset.alb===s.al));
}
function songChanged(){if(!cur())return;if(LIVE)liveOnTrack();saveQueue();setHue();loadLyrics(cur().id);renderMini();renderXP();markPlaying();if(sheetKind==='queue')queueSheet();}
let timer=null;
function setPlaying(v){
  if(LIVE&&castOn()){castPlay(v);return;}
  if(LIVE){
    clearInterval(timer);if(!v)cutJoin();else fxWake();
    if(v){const r=ensureSrc();if(!r)return;st.playing=true;if(r!=='pending')audio.play().catch(e=>{if(e.name==='AbortError')return;st.playing=false;toast('再生できませんでした: '+e.message);renderMini();renderXP();markPlaying();});}
    else{audio.pause();st.playing=false;}
    if(st.playing)timer=setInterval(updateProg,250);
    renderMini();renderXP();markPlaying();if('mediaSession' in navigator)navigator.mediaSession.playbackState=st.playing?'playing':'paused';return;
  }
  const p=st.pos;st.playing=v;st.pos=p;clearInterval(timer);
  if(v)timer=setInterval(()=>{if(st.pos>=cur().d){if(ted)tedAtEnd();else step(1,true);}else updateProg();},250);
  renderMini();renderXP();markPlaying();
}
function tedAtEnd(){setPlaying(false);toast('曲の終わりです。よければ「保存」を押してください');}
function step(dir,auto){
  const n=st.q.length;if(LIVE)cutJoin();
  if(auto&&st.rep===2){if(LIVE&&castOn()){castLoad(cur(),0,true);return;}st.pos=0;updateProg();if(LIVE&&st.playing)audio.play().catch(()=>{});return;}
  if(dir<0&&st.pos>3){st.pos=0;updateProg();return;}
  let i=st.qi+dir;
  if(i>=n){if(st.rep===1||!auto)i=0;else{st.pos=0;setPlaying(false);return;}}
  if(i<0)i=n-1;
  st.qi=i;st.pos=0;songChanged();
}
function playList(ids,start=0,go=true){
  if(!ids.length)return;
  if(LIVE)cutJoin();
  st.q=ids.slice();st.qi=Math.max(0,start);st.pos=0;st.shuf=false;st.orig=null;
  songChanged();if(go)setPlaying(true);
}
function enqueue(ids,next){
  if(!st.q.length){playList(ids);return;}
  if(next)st.q.splice(st.qi+1,0,...ids);else st.q.push(...ids);
  if(st.orig)st.orig.push(...ids);
  if(sheetKind==='queue')queueSheet();
}

/* ================= mixes ================= */
function personalMix(pool,n,first=[],bonus){
  const S=st.set;
  let ids=pool.filter(i=>!first.includes(i));
  const ok=ids.filter(i=>!(S.exclSkip&&SONGS[i].skips>=3));
  ids=ok.length>=Math.min(n,6)?ok:ids;
  const cut=Math.floor(ids.length*S.exclRecent/100);
  const recent=new Set(ids.slice().sort((a,b)=>SONGS[a].ago-SONGS[b].ago).slice(0,cut));
  const rest=ids.filter(i=>!recent.has(i));
  ids=rest.length>=Math.min(n,6)?rest:ids;
  const w=i=>{const s=SONGS[i];return (1+(s.fav?2:0)+Math.log2(1+s.plays)*.4+(s.plays===0?1.2:0)+(s.ago>60&&s.plays>0?.8:0))*(bonus?bonus(i):1);};
  return [...first,...spread(wsample(ids,w,Math.max(0,n-first.length)))];
}
const visIds=()=>SONGS.filter(vis).map(s=>s.id);
function startMix(label,ids){
  if(!ids.length){toast('ミックスに使える曲がありません。ソースの絞り込みを確認してください。');return;}
  playList(ids);toast(`${label}を作りました(${ids.length} 曲)`);
}
function mixTrack(){const v=visIds();startMix('曲ミックス',personalMix(v,Math.min(st.set.mixSize,v.length)));}
function mixAlbum(){
  const als=AL.filter(visAl);
  const w=a=>{const ss=songsOfAl(a.id);return Math.max(.1,1+ss.filter(s=>s.fav).length*.8+Math.log2(1+ss.reduce((x,s)=>x+s.plays,0))*.3+(Math.min(...ss.map(s=>s.ago))>60?1:0)-(Math.min(...ss.map(s=>s.ago))<7?.8:0));};
  const pick=wsample(als,w,Math.min(3,als.length));
  startMix('アルバムミックス',pick.flatMap(a=>songsOfAl(a.id).map(s=>s.id)));
}
function mixDecade(d){const v=visIds().filter(i=>decadeOf(alOf(SONGS[i]))===+d);startMix(`${d}年代ミックス`,personalMix(v,Math.min(st.set.mixSize,v.length)));}
function mixPersonal(){
  const v=visIds();
  const gp={};v.forEach(i=>{const s=SONGS[i];gp[alOf(s).g]=(gp[alOf(s).g]||0)+s.plays+(s.fav?5:0);});
  const top=Object.entries(gp).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);
  const pool=v.filter(i=>top.includes(alOf(SONGS[i]).g));
  startMix('パーソナルミックス',personalMix(pool.length>=8?pool:v,Math.min(st.set.mixSize,v.length)));
}
function mixInstant(id){
  const s=SONGS[id],a=alOf(s),v=visIds();
  let pool=v.filter(i=>{const b=alOf(SONGS[i]);return b.g===a.g||b.a===a.a;});
  if(pool.length<10)pool=v;
  const inG=i=>{const b=alOf(SONGS[i]);return b.g===a.g||b.a===a.a;};
  const ids=personalMix(pool,Math.min(st.set.mixSize,pool.length),[s.id],i=>inG(i)?4:1);
  const keep=st.playing&&cur().id===s.id;
  if(keep){st.q=ids;st.qi=0;if(sheetKind==='queue')queueSheet();toast(`「${s.t}」から近い曲のミックスを作りました(再生は続けます)`);renderXP();}
  else startMix('曲に近いミックス',ids);
}
function mixFrom(ids,label){const n=Math.min(st.set.mixSize,ids.length);startMix(label,personalMix(ids,n));}

let lpT=null,lpFired=false,lpX=0,lpY=0;
function selIds(){const out=[];st.sel.forEach(k=>{const [t,i]=k.split(':');if(t==='s')out.push(+i);else songsOfAl(+i).forEach(s=>out.push(s.id));});return out;}
function toggleSel(k){if(!st.sel)st.sel=new Set();st.sel.has(k)?st.sel.delete(k):st.sel.add(k);if(!st.sel.size)st.sel=null;refresh();}
function exitSel(){st.sel=null;refresh();}
function markSel(){
  document.querySelectorAll('[data-sel]').forEach(e=>e.classList.toggle('sel',!!(st.sel&&st.sel.has(e.dataset.sel))));
}
document.addEventListener('pointerdown',e=>{
  lpFired=false;
  const el=e.target.closest('[data-sel]');
  if(!el||e.target.closest('.ib'))return;
  lpX=e.clientX;lpY=e.clientY;clearTimeout(lpT);
  lpT=setTimeout(()=>{lpFired=true;if(!st.sel)st.sel=new Set();st.sel.add(el.dataset.sel);refresh();if(navigator.vibrate)navigator.vibrate(15);},480);
});
document.addEventListener('pointermove',e=>{if(lpT&&(Math.abs(e.clientX-lpX)>8||Math.abs(e.clientY-lpY)>8)){clearTimeout(lpT);lpT=null;}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lpT);lpT=null;}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-sel]'))e.preventDefault();});

const mi=(act,icon,label,attrs='')=>`<button class="mi" data-act="${act}" ${attrs}>${ico(icon,22)}<span>${label}</span></button>`;

// ---------- プロパティ(タグの表示・編集)。音楽ファイルに書き、前の値はサーバーに残るので元に戻せる ----------
const FIELD_LABEL={title:'曲名',artist:'アーティスト',album:'アルバム',albumartist:'アルバムアーティスト',date:'年(日付)',genre:'ジャンル',
  tracknumber:'曲番号(3 や 3/12)',discnumber:'ディスク番号',composer:'作曲者',comment:'コメント'};
let props=null;
async function openProps(k,id){
  const s=k==='song'?SONGS[id]:null,al=k==='album'?AL[id]:null;
  props={k,s,al,tab:'tags',meta:null,df:{},dt:{},nk:[],busy:false};
  openSheet('props',esc(k==='song'?s.t:al.t),`<div class="empty">読み込んでいます…</div>`);
  try{props.meta=await api(k==='song'?`/api/tracks/${s.dbid}/meta`:`/api/albums/${al.dbid}/meta`);}
  catch(e){toast('プロパティを読めませんでした: '+e.message);closeSheet();props=null;return;}
  renderProps();
}
const fmtSize=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB';
const fmtDate=t=>t?new Date(t*1000).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const joinV=v=>v.join('\n');
function renderProps(){
  if(!props||sheetKind!=='props'||!props.meta)return;
  const P=props,m=P.meta,song=P.k==='song',ro=!m.writable||!isAdmin();
  const tabs=song?[['tags','タグ'],['all','すべてのタグ'],['cover','カバー'],['file','ファイル']]:[['tags','タグ'],['cover','カバー']];
  let body=`<div class="props"><div class="seg">${tabs.map(([t,l])=>`<button class="chip ${P.tab===t?'pri':''}" data-act="propsTab" data-t="${t}">${l}</button>`).join('')}</div>`;
  if(ro)body+=`<div class="warn">このファイルには書き込めないので、表示だけです(音楽フォルダが読み取り専用でつながれている可能性があります)。</div>`;
  if(m.error)body+=`<div class="warn">${esc(m.error)}</div>`;
  if(P.tab==='tags'){
    const names=song?Object.keys(FIELD_LABEL):['album','albumartist','date','genre'];
    if(!song)body+=`<p class="note">${m.tracks} 曲すべてに書きます。「曲ごとに違う」の項目は、入力したときだけ書きます。空にした項目は全曲から消します。</p>`;
    body+=`<div class="form">${names.map(n=>{const orig=m.fields[n],v=P.df[n]!=null?P.df[n]:(orig||'');
      const ph=orig===null?'(曲ごとに違う)':'';
      return n==='comment'?`<label class="full" style="flex-direction:column;align-items:stretch">${FIELD_LABEL[n]}<textarea data-f="${n}" rows="2" ${ro?'readonly':''}>${esc(v)}</textarea></label>`
        :`<label>${FIELD_LABEL[n]}<input data-f="${n}" value="${esc(v)}" placeholder="${ph}" ${ro?'readonly':''}></label>`;}).join('')}</div>`;
    body+=histHtml(song?m.history:m.history.filter(x=>x.tracks>1));
  }else if(P.tab==='all'){
    body+=`<p class="note">タグの形式: ${esc((m.kind||'').toUpperCase())}。値が複数あるときは 1 行に 1 つ。空にするとそのタグを消します。</p><div class="tg">`;
    m.tags.forEach(t=>{const v=P.dt[t.key]!=null?P.dt[t.key]:joinV(t.values);
      body+=`<code>${esc(t.key)}</code>`+(t.editable&&!ro?`<textarea data-tk="${esc(t.key)}" rows="${Math.min(6,Math.max(1,v.split('\n').length))}">${esc(v)}</textarea>`:`<div class="ro">${esc(joinV(t.values))}</div>`);});
    for(let i=0;i<P.nk.length;i+=2)body+=`<input data-nk="${i}" placeholder="新しいタグ名" value="${esc(P.nk[i])}"><textarea data-nk="${i+1}" rows="1" placeholder="値">${esc(P.nk[i+1])}</textarea>`;
    body+=`</div>${ro?'':`<div style="padding:0 16px 12px"><button class="btn ghost sm" data-act="propsAddTag">${ico('add',16)}タグを追加</button></div>`}`;
  }else if(P.tab==='cover'){
    const src=song?(m.hasCover?`${API}/api/tracks/${P.s.dbid}/cover?t=${Date.now()}`:''):(P.al.art?`${API}/api/art/${P.al.dbid}?size=1000&v=${P.al.artv}`:'');
    body+=`<div class="cov">${src?`<img src="${src}" alt="">`:`<div class="none">カバーなし</div>`}<div class="acts">
      <p class="note" style="margin:0">${song?'この曲のファイルに埋め込みます。':`${m.tracks} 曲すべてに埋め込みます。`} JPEG か PNG(20MB まで)。</p>
      ${ro?'':`<button class="btn tonal sm" data-act="propsCover">${ico('add',16)}画像を選んで差し替える</button>`}
      ${song&&m.hasCover&&!ro?`<button class="btn ghost sm" data-act="propsCoverDel">${ico('close',16)}埋め込みの画像を消す</button>`:''}
      <input type="file" id="propscover" accept="image/jpeg,image/png" hidden></div></div>`;
    body+=histHtml(song?m.history:m.history.filter(x=>x.tracks>1));
  }else{
    const f=m.file,sr=f.sampleRate?(f.sampleRate/1000)+' kHz':'—';
    const rows=[['場所',`${f.source} / ${f.rel}`],['形式',`${f.codec}${m.kind?`(タグ: ${m.kind.toUpperCase()})`:''}`],['サンプルレート',sr],['ビット深度',f.bitDepth?f.bitDepth+' bit':'—'],
      ['ビットレート',f.kbps?f.kbps+' kbps':'—'],['長さ',fmtT(Math.round(f.durationMs/1000))],['サイズ',fmtSize(f.size)],['ファイルの更新日',fmtDate(f.mtime)],
      ['ライブラリに追加',fmtDate(f.addedAt)],['再生回数',`${f.plays} 回(スキップ ${f.skips} 回)`],['最後に再生',fmtDate(f.lastPlayed)],
      ['タグの補い',[f.tagFixed?'文字化けを直して表示':'',f.tagGuessed?'ファイル名・フォルダ名から補った':''].filter(Boolean).join('、')||'なし']];
    body+=`<div class="panel" style="margin:0 8px 8px">${rows.map(r=>`<div class="prow"><span class="tt"><small>${r[0]}</small><b style="font-weight:500;overflow-wrap:anywhere">${esc(String(r[1]))}</b></span></div>`).join('')}</div>`;
  }
  body+='</div>';
  const save=!ro&&(P.tab==='tags'||P.tab==='all')?`<button class="btn sm" data-act="propsSave" ${P.busy?'disabled':''}>${ico('check',16)}保存</button>`:'';
  openSheet('props',esc(song?P.s.t:P.al.t),body,save);

async function propsSave(){
  const P=props,m=P.meta,fields={},tags={};
  for(const[k,v]of Object.entries(P.df)){const o=m.fields[k];if(o===null?v.trim()!=='':v!==(o||''))fields[k]=v;}
  if(P.k==='song'){
    for(const t of m.tags){const v=P.dt[t.key];if(v==null||!t.editable||v===joinV(t.values))continue;const l=v.split('\n').map(x=>x.trim()).filter(Boolean);tags[t.key]=l.length?l:null;}
    for(let i=0;i<P.nk.length;i+=2){const k=P.nk[i].trim(),v=P.nk[i+1].split('\n').map(x=>x.trim()).filter(Boolean);if(k&&v.length)tags[k]=v;}
  }
  if(!Object.keys(fields).length&&!Object.keys(tags).length){toast('変更はありません');return;}
  P.busy=true;renderProps();
  try{
    if(P.k==='song')await api(`/api/tracks/${P.s.dbid}/meta`,{method:'PUT',json:{fields,tags}});
    else await api(`/api/albums/${P.al.dbid}/meta`,{method:'PUT',json:{fields}});
  }catch(e){P.busy=false;renderProps();toast('保存できませんでした: '+e.message);return;}
  propsAfter('タグを保存しました');
}

// 別のアプリに切り替えると OS が解除するので、戻ってきたら取り直す
const wake={on:false,lock:null};
try{wake.on=localStorage.getItem('otokura.wake')==='1';}catch(e){}
async function wakeApply(){
  if(!('wakeLock' in navigator))return;
  if(wake.on&&document.visibilityState==='visible'&&!wake.lock){
    try{wake.lock=await navigator.wakeLock.request('screen');wake.lock.addEventListener('release',()=>{wake.lock=null;});}catch(e){}
  }else if(!wake.on&&wake.lock){wake.lock.release();wake.lock=null;}
}

// スマホでは画面の回転も固定する(全画面=ホームに追加したアプリのときだけ効く)。PC は並びだけ切り替える
const ORI=['auto','landscape','portrait'],ORI_LABEL={auto:'自動',landscape:'横の表示',portrait:'縦の表示'};
const LANDSCAPE='(orientation:landscape) and (max-height:600px)',landMQ=matchMedia(LANDSCAPE);

const canLock=()=>!!(screen.orientation&&screen.orientation.lock)&&matchMedia('(pointer:coarse)').matches;
async function applyOri(quiet){
  if(!canLock())return;
  try{if(ori==='auto')screen.orientation.unlock();else await screen.orientation.lock(ori);}
  catch(e){if(!quiet&&ori!=='auto')toast('画面の回転は固定できないので、表示の並びだけ切り替えました');}
}

const scan={on:false,pct:0,t:null};
function updateScan(){
  document.querySelectorAll('.scanbar').forEach(b=>b.style.width=(scan.on?scan.pct:0)+'%');
  document.querySelectorAll('.scanlabel').forEach(l=>l.textContent=scan.on?(scan.label||`スキャン中… ${scan.pct}%`):(scan.idle||'差分スキャン: 毎日 03:00'));

function startScan(){
  if(scan.on)return;scan.on=true;scan.pct=0;updateScan();

    if(scan.pct>=100){clearInterval(scan.t);scan.on=false;st.providers[0].last='たった今';updateScan();toast('スキャンが完了しました。新しい曲は 2 件です。');if(route().a==='settings')refresh();}},250);

async function api(path,opt={}){
  const o={...opt,headers:{...(opt.headers||{})}};
  if(o.json!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.json);delete o.json;}
  const r=await fetch(API+path,o);
  if(r.status===401&&LIVE&&AUTH.user){AUTH.user=null;location.reload();}   // ログインが切れた(別の端末でパスワードを変えたなど)
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||('HTTP '+r.status));}
  return r.json();
}
const hashHue=t=>{let h=0;for(const c of String(t))h=(h*31+c.codePointAt(0))>>>0;return h%360;};
const LOSSLESS=['FLAC','WAV','AIFF','ALAC','APE','TTA','WavPack'];
function fmtLabel(t){
  const sr=t.sampleRate?(t.sampleRate%1000?(t.sampleRate/1000).toFixed(1):t.sampleRate/1000):'';
  if(t.codec==='DSD')return t.sampleRate?`DSD${Math.round(t.sampleRate/44100)}`:'DSD';
  if(LOSSLESS.includes(t.codec))return `${t.codec} ${t.bitDepth||16}/${sr}`;
  return `${t.codec}${t.kbps?' '+t.kbps:''}`;
}
function deriveLibrary(){
  GENRES=[...new Set(AL.map(a=>a.g).filter(Boolean))];GENRES.forEach(g=>{if(GH[g]==null)GH[g]=hashHue(g);});

}

  for(const k of Object.keys(st.src))if(!SRCS.some(x=>x.id===k))delete st.src[k];

             tr:[],added:a.addedAt,src:a.source,art:!!a.hasArt,artv:a.art||'',folder:a.folder});});
  d.tracks.forEach(r=>{const t=C(d.trackColumns,r),ai=aIdx.get(t.albumId);if(ai==null)return;const al=AL[ai];
    const s={id:SONGS.length,dbid:t.id,al:ai,n:t.no||al.tr.length+1,disc:t.disc||1,t:t.title,ar:t.artist,d:Math.max(1,Math.round(t.durationMs/1000)),
      plays:t.plays,fav:!!t.fav,rating:t.rating,ago:t.lastPlayed?Math.floor((d.now-t.lastPlayed)/86400):999,last:t.lastPlayed||0,skips:t.skips,
      codec:t.codec,sr:t.sampleRate||0,cue:!!t.cue,rgT:t.rgTrack,rgA:t.rgAlbum,head:t.headMs,tail:t.tailMs,playable:PLAYABLE.includes(t.codec),rel:t.rel,src:t.source,fmt:fmtLabel(t)};
    SONGS.push(s);al.tr.push(s.id);if(!al.f)al.f=s.fmt;
