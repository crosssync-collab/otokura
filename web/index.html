  let o=null;try{o=JSON.parse(localStorage.getItem('otokura.queue')||'null');}catch(e){}
  if(o&&o.q){const q=o.q.map(x=>byDb.get(x)).filter(x=>x!=null);if(q.length){st.q=q;st.qi=Math.min(o.qi||0,q.length-1);pendingSeek=o.pos||0;return;}}
  const first=AL.find(a=>a.tr.length);st.q=first?first.tr.slice():[];st.qi=0;
}

/* --- 再生 --- */
let lt={dbid:null,listened:0,counted:false,ended:false,last:0},skipChain=0,switching=false;
// NAS で変換して配る形式(ALAC・AIFF・APE・TTA・WavPack・DSD → FLAC、WMA・MPC → AAC)。
// ALAC・AIFF は Safari ならそのまま鳴るので、鳴らせる端末には変換せずに送ってもらう(direct=1)
let TRANSCODE={};const tcReady=new Set();
const DIRECT_MIME={ALAC:'audio/mp4; codecs="alac"',AIFF:'audio/aiff'};
const canDirect=s=>!!(DIRECT_MIME[s.codec]&&audio.canPlayType(DIRECT_MIME[s.codec]));
const CUT_LOSSY=['MP3','AAC','Vorbis','Opus','WMA','MPC'];
const tcTarget=s=>s.cue?(CUT_LOSSY.includes(s.codec)?'AAC':'FLAC'):TRANSCODE[s.codec];   // CUE シートの曲は区間を切り出して配る
const needsTc=s=>!!(s&&!s.local&&(s.cue||TRANSCODE[s.codec]&&!canDirect(s)));
function tcPrepare(s){   // 次の曲を先に変換しておく
  if(!needsTc(s)||tcReady.has(s.dbid))return;
  api(`/api/tracks/${s.dbid}/prepare`,{method:'POST'}).then(r=>{if(r.ready)tcReady.add(s.dbid);}).catch(()=>{});
}
function ensureSrc(){
  const s=cur();if(!s)return false;
  if(!s.playable){toast(`${s.codec} は再生できません`);return false;}
  if(s.local){audio.volume=1;return localSrc(s);}
  if(audio.dataset.dbid!==String(s.dbid)){switching=st.playing;
    if(VOL_OK&&audioB.dataset.dbid===String(s.dbid)&&audioB.readyState>=1){   // 先読みしてあった曲へはすぐ切り替える
      const old=audio;audio=audioB;audioB=old;old.pause();try{audio.currentTime=pendingSeek||0;}catch(e){}pendingSeek=0;
    }else{
      if(needsTc(s)&&!tcReady.has(s.dbid))toast(s.cue?'曲を切り出しています(初めての曲だけ数秒かかります)':`${s.codec} を ${TRANSCODE[s.codec]} に変換しています(初めての曲だけ数秒かかります)`);
      audio.src=streamUrl(s);audio.dataset.dbid=String(s.dbid);tcReady.add(s.dbid);}}
  const nx=SONGS[st.q[st.qi+1]];if(nx){tcPrepare(nx);wantLoud(nx);}
  wantLoud(s);applyGain();
  return true;
}
const streamUrl=s=>`${API}/api/tracks/${s.dbid}/stream${canDirect(s)&&!s.cue?'?direct=1':''}`;
/* --- 音量をそろえる・曲をつなぐ。音量は audio.volume で下げる方向だけ(ブラウザの再生をそのまま使い、画面を消しても止まらないように)。
       iPhone は volume を変えられず、操作なしで別の audio 要素を鳴らすこともできないので、つなぎは行わない --- */
const VOL_OK=LIVE&&(()=>{const a=new Audio();a.volume=.5;return a.volume===.5;})();
let gapTimer=null,fadeRun=null,volRamp=null;const loudAsked=new Set();
function wantLoud(s){   // タグが無い曲は NAS で測る(初回だけ数秒〜十数秒)
  if(!LIVE||!s||s.local||!s.playable||loudAsked.has(s.dbid))return;
  const S=st.set;if(!((S.rg&&s.rgT==null)||(S.fade&&s.tail==null)))return;
  loudAsked.add(s.dbid);
  api(`/api/tracks/${s.dbid}/loudness`,{method:'POST'}).then(r=>{s.rgT=r.rgTrack;if(r.rgAlbum!=null)s.rgA=r.rgAlbum;s.head=r.headMs;s.tail=r.tailMs;if(s===cur())applyGain(true);}).catch(()=>{});
}
function albumGain(s){   // アルバムのタグが無ければ、アルバムの全曲の値を音のエネルギーで平均する
  if(s.rgA!=null)return s.rgA;
  const g=alOf(s).tr.map(i=>SONGS[i].rgT);if(!g.length||g.some(x=>x==null))return s.rgT;
  return -10*Math.log10(g.reduce((a,x)=>a+Math.pow(10,-x/10),0)/g.length);
}
function gainDb(s){   // 同じアルバムが続くときはアルバムの値(曲ごとの大小を保つ)、それ以外は曲の値
  if(!st.set.rg||!s||s.local)return 0;
  const near=[st.q[st.qi-1],st.q[st.qi+1]].some(i=>i!=null&&SONGS[i]&&SONGS[i].al===s.al);
  return (near?albumGain(s):s.rgT)||0;
}
const gainVol=s=>Math.min(1,Math.pow(10,gainDb(s)/20));
function applyGain(smooth){
  if(!LIVE||!cur()||castOn()||fadeRun)return;
  const to=gainVol(cur());clearInterval(volRamp);volRamp=null;fxBoost(audio,cur());
  if(!smooth||Math.abs(audio.volume-to)<.02){audio.volume=to;return;}
  const el=audio,from=el.volume,t0=performance.now();   // 再生の途中で値が届いたときは急に変えない
  volRamp=setInterval(()=>{const x=Math.min(1,(performance.now()-t0)/500);if(el===audio&&!fadeRun)el.volume=from+(to-from)*x;if(x>=1){clearInterval(volRamp);volRamp=null;}},40);
}
function nextOf(){   // 自動で次に進む先
  if(st.rep===2)return null;
  let i=st.qi+1;if(i>=st.q.length){if(st.rep!==1)return null;i=0;}
  const s=SONGS[st.q[i]];return s?{i,s}:null;
}
function joinKind(s,n){   // 'gap': そのままつなぐ / 'fade': 重ねてつなぐ / null: つながない
  const S=st.set;if(!VOL_OK||s.local||n.local||!n.playable)return null;
  const follows=n.al===s.al&&(n.disc===s.disc&&n.n===s.n+1||n.disc===s.disc+1&&n.n===1);   // アルバムの続きの曲は重ねない
  if(follows)return S.gap?'gap':null;
  return S.fade?'fade':S.gap?'gap':null;
}
const fadeLenOf=(s,n)=>Math.min(st.set.fadeLen||6,s.d/3,n.d/3);
function seamTick(){   // 再生位置が進むたびに呼ぶ
  if(fadeRun){fadeTick();return;}
  if(!VOL_OK||castOn()||ted||!st.playing||audio.paused)return;
  const s=cur(),nx=nextOf();if(!s||!nx||nx.s===s)return;
  const kind=joinKind(s,nx.s),d=audio.duration;if(!kind||!isFinite(d)||!d)return;
  const len=kind==='fade'?fadeLenOf(s,nx.s):0,left=d-(kind==='fade'?(s.tail||0)/1000:0)-audio.currentTime;
  if(left>25+len)return;
  wantLoud(nx.s);   // キューを入れ替えたあとでも、つなぐ前に無音の位置が分かるように
  if(audioB.dataset.dbid!==String(nx.s.dbid)){audioB.src=streamUrl(nx.s);audioB.dataset.dbid=String(nx.s.dbid);tcReady.add(nx.s.dbid);return;}
  if(audioB.currentTime>.05&&!audioB.seeking)audioB.currentTime=0;     // さっき鳴らした曲がまた次に来たときは、先頭へ戻しておく
  if(audioB.readyState<3||audioB.seeking)return;        // 間に合わなければ、曲の終わりでふつうに切り替える
  if(kind==='fade'){if(left<=len)joinNow('fade',nx,len);return;}
  if(left<.4&&!gapTimer)gapWait(nx);
}
function gapWait(nx){   // 曲の終わりの直前まで待つ。timeupdate は 4 回/秒なので、残りを測り直しながら近づける
  // エフェクトの経路では再生位置がまとまって進み、終わりを飛び越えるので、その分だけ早く始めて前の曲は最後まで鳴らす
  const r=audio.duration-audio.currentTime,lead=fxCtx?Math.min(.06,.012+(fxCtx.baseLatency||0)):.012;
  if(r<=lead){gapTimer=null;joinNow('gap',nx,0);return;}
  gapTimer=setTimeout(()=>gapWait(nx),Math.max(1,(r-lead)*1000*.8));
}
function joinNow(kind,nx,len){
  if(!st.playing||SONGS[st.q[nx.i]]!==nx.s||audioB.dataset.dbid!==String(nx.s.dbid)||castOn())return;
  const old=audio,oldVol=old.volume;
  audio=audioB;audioB=old;clearInterval(volRamp);volRamp=null;
  lt.ended=true;pendingSeek=0;
  if(kind==='fade'){
    try{audio.currentTime=(nx.s.head||0)/1000;}catch(e){}
    audio.volume=0;fadeRun={old,oldVol,len,t0:performance.now(),iv:setInterval(fadeTick,50)};
  }
  st.qi=nx.i;fxBoost(audio,nx.s);
  audio.play().catch(()=>{});
  if(kind==='gap'){audio.volume=gainVol(nx.s);
    if(fxCtx)setTimeout(()=>{if(old!==audio)old.pause();},Math.max(0,(old.duration-old.currentTime)*1000)+80);else old.pause();}
  songChanged();
}
function fadeTick(){
  const f=fadeRun;if(!f)return;
  const x=Math.min(1,(performance.now()-f.t0)/(f.len*1000));
  f.old.volume=f.oldVol*Math.cos(x*Math.PI/2);audio.volume=gainVol(cur())*Math.sin(x*Math.PI/2);
  if(x>=1)cutJoin();
}
function cutJoin(){   // つなぎの途中で操作されたら、すぐ次の曲だけにする
  clearTimeout(gapTimer);gapTimer=null;
  const f=fadeRun;if(!f)return;
  clearInterval(f.iv);fadeRun=null;f.old.pause();audio.volume=gainVol(cur());
}
function liveOnTrack(){
  const s=cur();
  // 30 秒より前に次へ進んだ曲はスキップとして記録
  if(lt.dbid!=null&&lt.dbid!==s.dbid&&!lt.counted&&!lt.ended&&lt.listened>1&&lt.listened<30){
    const pi=byDb.get(lt.dbid);if(pi!=null)SONGS[pi].skips++;if(typeof lt.dbid==='number')api(`/api/tracks/${lt.dbid}/skipped`,{method:'POST'}).catch(()=>{});}
  if(lt.dbid!==s.dbid)lt={dbid:s.dbid,listened:0,counted:false,ended:false,last:0};
  mediaMeta(s);
  if(!st.playing)return;
  if(!s.playable){
    if(++skipChain>=Math.min(st.q.length,20)){skipChain=0;setPlaying(false);toast('このキューには、いま再生できる曲がありません');return;}
    toast(`${s.codec} は再生できないので、次の曲へ進みます`);setTimeout(()=>step(1,true),0);return;
  }
  skipChain=0;
  if(castOn()){castLoad(s,0,true);return;}
  if(ensureSrc()==='pending')return;if(fadeRun)return;audio.play().then(()=>{switching=false;}).catch(()=>{});
}
function mediaMeta(s){
  if(!('mediaSession' in navigator)||!s)return;const al=alOf(s);
  try{navigator.mediaSession.metadata=new MediaMetadata({title:s.t,artist:s.ar||al.a,album:al.t,
    artwork:al.artUrl?[{src:al.artUrl}]:al.art?[300,1000].map(z=>({src:new URL(`${API}/api/art/${al.dbid}?size=${z}&v=${al.artv||''}`,location.href).href,sizes:`${z}x${z}`,type:'image/jpeg'})):[]});}catch(e){}
}
if(LIVE){
  for(const el of [audio,audioB]){
    const mine=f=>e=>{if(el===audio)f(e);};   // 先読み中・フェードアウト中の要素の出来事は無視する
    el.preload='auto';
    el.addEventListener('loadedmetadata',mine(()=>{if(pendingSeek){try{audio.currentTime=pendingSeek;}catch(e){}}pendingSeek=0;}));
    el.addEventListener('timeupdate',mine(()=>{if(!castOn()){onListen(audio.currentTime);seamTick();}}));
    el.addEventListener('seeking',mine(()=>{clearTimeout(gapTimer);gapTimer=null;}));
    el.addEventListener('ended',mine(()=>{if(ted){tedAtEnd();return;}lt.ended=true;step(1,true);}));
    el.addEventListener('pause',mine(()=>{if(switching||audio.ended||!st.playing)return;st.playing=false;clearInterval(timer);renderMini();renderXP();markPlaying();}));
    el.addEventListener('play',mine(()=>{switching=false;if(st.playing)return;st.playing=true;clearInterval(timer);timer=setInterval(updateProg,250);renderMini();renderXP();markPlaying();}));
    el.addEventListener('error',()=>{
      if(el!==audio){el.removeAttribute('src');delete el.dataset.dbid;return;}     // 先読みの失敗は、曲の終わりでふつうに読み直す
      if(!audio.getAttribute('src'))return;const s=cur();st.playing=false;switching=false;renderMini();renderXP();
      toast(`再生できませんでした(${s?s.t:''})。ファイルが動かされていないか確認し、再スキャンしてください`);});
  }
  if('mediaSession' in navigator){const ms=navigator.mediaSession,h=(a,f)=>{try{ms.setActionHandler(a,f);}catch(e){}};
    h('play',()=>setPlaying(true));h('pause',()=>setPlaying(false));h('nexttrack',()=>step(1));h('previoustrack',()=>step(-1));
    h('seekto',e=>{st.pos=e.seekTime;updateProg();});}
  addEventListener('beforeunload',saveQueue);
}

// 再生回数とスキップの記録(このブラウザでも Cast でも、再生位置が進むたびに呼ぶ)
function onListen(t){
  const dt=t-lt.last;lt.last=t;if(dt>0&&dt<2)lt.listened+=dt;
  const s=cur();
  if(s&&!lt.counted&&lt.listened>=Math.min(240,s.d/2)){lt.counted=true;s.plays++;s.ago=0;s.last=Date.now()/1000;if(!s.local)api(`/api/tracks/${s.dbid}/played`,{method:'POST'}).catch(()=>{});}
  if(Math.floor(t)%5===0)saveQueue();
}

/* --- Google Cast(Chrome の Cast 機能)。機器は NAS の家の中のアドレス(castUrl)から曲を直接取りに行く。
       キューはこの画面が持つので、画面を開いている間だけ次の曲へ進む --- */
var castP=null,castC=null,castS=null,castM=null,castUrl='',castT={t:0,at:0},castReady=false;   // st.pos から先に参照されるので var
var dlnaS=null,castSeq=0;   // いま操作している DLNA の機器
function castOn(){return !!(castS||dlnaS);}
const castBase=()=>(SERVER&&SERVER.castUrl)||location.origin;
const CAST_MIME={FLAC:'audio/flac',MP3:'audio/mpeg',AAC:'audio/mp4',Vorbis:'audio/ogg',Opus:'audio/ogg',WAV:'audio/wav'};
function castPos(){const s=cur(),p=castT.t+(st.playing?(performance.now()-castT.at)/1000:0);return s?Math.min(p,s.d):p;}
window.__onGCastApiAvailable=ok=>{
  if(!ok)return;
  const ctx=cast.framework.CastContext.getInstance(),E=cast.framework.RemotePlayerEventType;
  ctx.setOptions({receiverApplicationId:chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,autoJoinPolicy:chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED});
  castP=new cast.framework.RemotePlayer();castC=new cast.framework.RemotePlayerController(castP);
  castC.addEventListener(E.IS_CONNECTED_CHANGED,()=>castConnected(castP.isConnected));
  castC.addEventListener(E.CURRENT_TIME_CHANGED,()=>{if(!castOn())return;castT={t:castP.currentTime,at:performance.now()};onListen(castP.currentTime);});
  castC.addEventListener(E.IS_PAUSED_CHANGED,()=>{if(!castOn()||!castM)return;const v=!castP.isPaused;if(v!==st.playing){castT={t:castP.currentTime,at:performance.now()};st.playing=v;castRender();}});
  castC.addEventListener(E.VOLUME_LEVEL_CHANGED,()=>{const r=$('#castvol');if(r&&document.activeElement!==r){r.value=Math.round(castP.volumeLevel*100);r.nextElementSibling.textContent=r.value;}});
  castReady=true;if(sheetKind==='out')outSheet();
  if(castP.isConnected)castConnected(true);
};
function castRender(){clearInterval(timer);if(st.playing)timer=setInterval(updateProg,250);renderMini();renderXP();markPlaying();updateProg();}
function castConnected(on){
  const ctx=cast.framework.CastContext.getInstance();
  if(on&&!castS){
    if(viz)vizClose();if(dlnaS)dlnaDisconnect(true);
    cutJoin();
    castS=ctx.getCurrentSession();if(!castS)return;
    const name=castS.getCastDevice().friendlyName||'Google Cast',pos=audio.readyState?audio.currentTime:pendingSeek,play=st.playing;
    switching=true;audio.pause();switching=false;
    OUTS.splice(1);OUTS.push(['cast',name,'Google Cast','cast',true,'']);st.out='cast';
    castT={t:pos,at:performance.now()};
    if(cur())castLoad(cur(),pos,play);
    toast(name+' で再生します');
  }else if(!on&&castS){
    const pos=castPos(),name=(OUTS[1]||[])[1]||'Google Cast';
    castS=null;castM=null;castUrl='';OUTS.splice(1);st.out='browser';st.playing=false;
    if(cur()){ensureSrc();st.pos=pos;}
    toast(name+' から切断しました。このブラウザで続きから再生できます');
  }else return;
  castRender();if(sheetKind==='out')outSheet();
}
function castLoad(s,pos,play){
  if(!castOn()||!s)return;
  if(s.local){toast('この端末の曲は Cast できないので、次の曲へ進みます');setTimeout(()=>step(1,true),0);return;}
  // 変換するもの・48kHz を超えるもの(Cast 向けに 48kHz の FLAC にする)は変換後の形式で送る
  const tt=s.cue||TRANSCODE[s.codec]?tcTarget(s):null;
  const mime=tt==='AAC'?'audio/mp4':tt||s.sr>48000?'audio/flac':CAST_MIME[s.codec];
  if(!s.playable||!mime){toast(`${s.codec} は Cast で再生できないので、次の曲へ進みます`);setTimeout(()=>step(1,true),0);return;}
  if(dlnaS){dlnaLoad(s,pos,play);return;}
  const seq=++castSeq;st.playing=play!==false;castRender();   // 機器はログインできないので、この曲だけに使える署名付きのアドレスをもらう
  api(`/api/tracks/${s.dbid}/cast-link`).then(L=>{if(seq===castSeq&&castS)castSend(s,pos,play,mime,L);}).catch(e=>{if(seq===castSeq){st.playing=false;castRender();toast('Cast で再生できませんでした: '+e.message);}});
}
function castSend(s,pos,play,mime,L){
  const al=alOf(s),url=L.url;
  const mi=new chrome.cast.media.MediaInfo(url,mime),md=new chrome.cast.media.MusicTrackMediaMetadata();
  md.title=s.t;md.artist=s.ar||al.a;md.albumName=al.t;
  if(L.art)md.images=[new chrome.cast.Image(L.art)];
  mi.metadata=md;mi.streamType=chrome.cast.media.StreamType.BUFFERED;
  const req=new chrome.cast.media.LoadRequest(mi);req.currentTime=pos||0;req.autoplay=play!==false;
  castUrl=url;castT={t:pos||0,at:performance.now()};st.playing=play!==false;castRender();
  castS.loadMedia(req).then(()=>{
    const m=castS&&castS.getMediaSession();if(!m)return;castM=m;
    // 曲が最後まで終わったら次の曲へ(この画面が開いている間だけ)
    m.addUpdateListener(alive=>{if(!alive&&m===castM&&m.idleReason===chrome.cast.media.IdleReason.FINISHED&&castUrl===url){lt.ended=true;step(1,true);}});
  },e=>{st.playing=false;castRender();
    toast('Cast で再生できませんでした'+(location.hostname.endsWith('.ts.net')&&!(SERVER&&SERVER.castUrl)?'(機器から NAS に届くアドレスが設定されていません)':`(${e&&e.code||e})`));});
}
function castPlay(v){
  if(dlnaS){dlnaPlay(v);return;}
  if(!castM||castM.playerState===chrome.cast.media.PlayerState.IDLE){if(v)castLoad(cur(),castPos(),true);return;}
  if(castP.isPaused===v)castC.playOrPause();
  castT={t:castPos(),at:performance.now()};st.playing=v;castRender();
}
function castSeek(v){if(dlnaS){dlnaSeek(v);return;}if(!castM)return;castP.currentTime=v;castC.seek();castT={t:v,at:performance.now()};}
function castPick(){
  if(!castReady){toast('Google Cast は Chrome で https のアドレスから開いたときに使えます');return;}
  cast.framework.CastContext.getInstance().requestSession().catch(e=>{if(e!=='cancel'&&e!==chrome.cast.ErrorCode.CANCEL)toast('Cast の機器に接続できませんでした: '+e);});
}
function castStop(){if(dlnaS){dlnaDisconnect();return;}if(castS)cast.framework.CastContext.getInstance().endCurrentSession(true);}
/* --- DLNA・UPnP。操作は NAS から行い(機器の一覧・再生・位置の確認)、機器は castUrl から曲を取りに来る。
       キューはこの画面が持つので、Cast と同じく画面を開いている間だけ次の曲へ進む --- */
const DLNA={list:null,busy:false,castUrl:'',added:new Map()};   // added: この画面で手で足した機器(探している途中に足しても一覧から消えないように)
function outRefresh(){if(sheetKind==='out')outSheet();else if(route().a==='settings')refresh();}
function dlnaSearch(search){
  if(DLNA.busy)return;DLNA.busy=true;outRefresh();
  api(`/api/dlna/devices${search?'?search=1':''}`).then(r=>{DLNA.list=r.devices.concat([...DLNA.added.values()].filter(a=>!r.devices.some(d=>d.id===a.id)));DLNA.castUrl=r.castUrl||'';})
    .catch(e=>{DLNA.list=DLNA.list||[];toast('DLNA の機器を探せませんでした: '+e.message);})
    .finally(()=>{DLNA.busy=false;outRefresh();});
}
function dlnaConnect(id){
  const dev=(DLNA.list||[]).find(x=>x.id===id);if(!dev)return;
  if(dlnaS&&dlnaS.id===id)return;
  if(viz)vizClose();
  if(dlnaS)dlnaDisconnect(true);if(castS)castStop();
  cutJoin();
  const pos=audio.readyState?audio.currentTime:pendingSeek,play=st.playing;
  switching=true;audio.pause();switching=false;
  dlnaS={id,name:dev.name,hasVol:dev.volume,vol:null,seq:0,uri:'',live:false,lastPos:pos,busy:false,fails:0,iv:setInterval(dlnaPoll,1500)};
  OUTS.splice(1);OUTS.push(['dlna',dev.name,'DLNA / UPnP','dlna',true,'']);st.out='dlna';
  castT={t:pos,at:performance.now()};
  if(cur())castLoad(cur(),pos,play);
  toast(dev.name+' で再生します');
  castRender();outRefresh();
}
function dlnaDisconnect(quiet){

function localSrc(s){
  if(audio.dataset.dbid===String(s.dbid))return true;
  switching=st.playing;audio.dataset.dbid=String(s.dbid);audio.removeAttribute('src');
  localFile(s).then(f=>{if(audio.dataset.dbid!==String(s.dbid))return;
    if(localUrlNow)URL.revokeObjectURL(localUrlNow);localUrlNow=URL.createObjectURL(f);audio.src=localUrlNow;
    if(st.playing)audio.play().then(()=>{switching=false;}).catch(()=>{});})
  .catch(e=>{st.playing=false;switching=false;renderMini();renderXP();toast(e.message);});

}
async function localFile(s){
  const src=LSRC.find(x=>x.id===s.src);if(!src)throw new Error('この曲の置き場所が見つかりません');
  if(src.kind==='copy'){const r=await LDB.get('files',s.lid);if(!r)throw new Error('取り込んだファイルが見つかりません');return r.blob;}
  if(!await localPermOk(src,true))throw new Error(`「${src.name}」を読む許可がありません。設定のメディアプロバイダで許可してください`);
  let h=src.handle;const parts=s.rel.split('/');
  try{for(const p of parts.slice(0,-1))h=await h.getDirectoryHandle(p);return await (await h.getFileHandle(parts[parts.length-1])).getFile();}
  catch(e){throw new Error('ファイルが見つかりません。メディアプロバイダで読み直してください');}
}
const localOffsets=(()=>{try{return JSON.parse(localStorage.getItem('otokura.localOffsets')||'{}');}catch(e){return {};}})();
// この端末の曲の歌詞: タグの歌詞に、読み込んだ・記録した歌詞(手動登録)をこの端末のブラウザに保存して重ねる。前の版を 1 つ残す
async function localLyrics(s,method,path,body){
  const off=()=>localOffsets[s.lid]||0,setOff=v=>{localOffsets[s.lid]=v|0;try{localStorage.setItem('otokura.localOffsets',JSON.stringify(localOffsets));}catch(e){}};
  let m=await LDB.get('lyrics',s.lid);const keep=()=>{m=m||{id:s.lid};m.prev={text:m.text||null,off:off()};};
  if(method==='PUT'&&path==='/offset')setOff(body.offsetMs);
  if(method==='PUT'&&path===''){keep();m.text=body.text;if(body.offsetMs!=null)setOff(body.offsetMs);await LDB.put('lyrics',m);}
  if(method==='DELETE'&&path==='/manual'){keep();m.text=null;await LDB.put('lyrics',m);}
  if(method==='POST'&&path==='/restore'){if(!m||!m.prev)throw new Error('戻せる版がありません');m.text=m.prev.text;setOff(m.prev.off);m.prev=null;await LDB.put('lyrics',m);}
  const t=await LDB.get('tracks',s.lid),ms=s.d*1000;
  const ly=m&&m.text?parseLyricsText(m.text,'manual',ms):t&&t.lyrics?parseLyricsText(t.lyrics,'tag:text',ms):null;
  return {trackId:s.dbid,available:!!ly,lyrics:ly,offsetMs:off(),canFetch:false,lrclibMiss:false,hasPrev:!!(m&&m.prev)};
}

  const fps=Object.entries(fx.vizFps||{}).map(([k,v])=>`${(VIZ_MODES.find(m=>m[0]===k)||[,k])[1]} ${v} fps`).join(' ・ ');
  return `${castOn()?`<p class="muted" style="font-size:13px;margin:4px;color:var(--err)">Cast・DLNA へ送っている間はエフェクトもビジュアライザーも効きません。このブラウザで鳴らすと効きます。</p>`:''}
  <div class="panel"><div class="prow"><span class="tt"><b>エフェクトを使う</b><small>この端末だけの設定です。オフのときは処理しません</small></span><button class="sw" role="switch" aria-checked="${fx.on}" aria-label="エフェクトを使う" data-act="fxOn" data-fxsw="on"></button></div>
    <div class="prow"><span class="tt"><b>夜間モード</b><small>音量の差を縮めて、小さな音でも聴きやすくします</small></span><button class="sw" role="switch" aria-checked="${fx.night}" aria-label="夜間モード" data-act="fxNight" data-fxsw="night"></button></div></div>

    <div class="prow" style="flex-wrap:wrap;gap:8px"><input id="eqname" placeholder="プリセット名" autocomplete="off" style="flex:1;min-width:160px"><button class="btn ghost sm" data-act="fxEqSave">${ico('add',18)}保存</button><button class="btn ghost sm fxuser-del" data-act="fxEqDel" ${st.set.eqUser&&st.set.eqUser[fx.eq]?'':'hidden'}>削除</button></div>
    ${EQ_PRESETS.map(g=>`<div class="fxg"><small>${esc(g[0])}</small><span class="seg">${g[1].map(p=>eqChip(p[0])).join('')}</span></div>`).join('')}</div>
  <div class="group">空間</div><div class="panel"><div class="fxg">${fxChips('space',SPACES)}</div><div class="prow" style="flex-wrap:wrap"><span class="tt" style="min-width:120px"><b>響きの量</b></span><span class="rng"><input type="range" min="10" max="200" step="10" value="${fx.wet}" data-fxwet="1" aria-label="響きの量"><output>${fx.wet}%</output></span></div></div>
  <div class="group">エコー</div><div class="panel"><div class="fxg">${fxChips('echo',ECHOES)}</div></div>
  <div class="group">真空管アンプ</div><div class="panel"><div class="fxg">${fxChips('tube',TUBES)}</div></div>
  <div class="group">ビジュアライザー</div><div class="panel"><div class="fxg">${fxChips('vizMode',VIZ_MODES.filter(m=>m[0]!=='milk'||hasWebGL2()))}</div><div class="prow" style="flex-wrap:wrap;gap:8px"><span class="tt" style="min-width:200px"><small>${diag}</small>${fps?`<small>この端末の実測: ${esc(fps)}</small>`:''}</span><button class="btn sm" data-act="vizOpen">${ico('viz',18)}全画面で見る</button></div></div>`;
}
function fxSheet(){openSheet('fx','エフェクト',`<div class="fxbody">${fxBody()}</div>`);}
function fxRedraw(){document.querySelectorAll('.fxbody').forEach(e=>{e.innerHTML=fxBody();});}
let eqRouteT=null;
function fxEqInput(i,v){   // 動かしている間は値だけ変え、つなぎ直しは止まってから
  fx.bands[i]=v;fx.eq='カスタム';if(v)fx.on=true;fxSave();if(fxWanted())fxWake();fxBands();fxMark();
  clearTimeout(eqRouteT);eqRouteT=setTimeout(fxRoute,150);

/* --- ビジュアライザー(全画面)。Canvas は自作、ミルクドロップは Butterchurn(MIT、CDN から読む)。Stick などでは解像度とコマ数を落とす --- */
const VIZ_MODES=[['ring','リング'],['bars','スペクトラム'],['wave','光る波形'],['aurora','オーロラ'],['stars','星の海'],['milk','ミルクドロップ']];
var viz=null;
const vizList=()=>VIZ_MODES.filter(m=>m[0]!=='milk'||hasWebGL2());
function vizOpen(){
  if(castOn()){toast('Cast・DLNA へ送っている間はビジュアライザーを使えません');return;}
  if(!HAS_WEBAUDIO){toast('この端末はビジュアライザーに対応していません');return;}
  viz={};closeSheet();
  if(!fxEnsure()){viz=null;return;}
  fxWake();
  const c=fxCtx,an=c.createAnalyser();an.fftSize=LOW_DEVICE?1024:2048;an.smoothingTimeConstant=.78;fxN.tap.connect(an);
  const root=$('#viz'),cv=$('#vizcv'),gl=$('#vizgl');
  Object.assign(viz,{an,freq:new Uint8Array(an.frequencyBinCount),time:new Uint8Array(an.fftSize),scale:1,last:0,frames:0,fpsT:performance.now(),low:0,stars:[],peaks:[],t:0,songId:null,ctx:cv.getContext('2d'),cv,gl,raf:0,mode:null,milk:null,idle:0});
  root.classList.add('open');
  history.pushState({viz:1},'');
  vizSize();addEventListener('resize',vizSize);vizSetMode(fx.vizMode);vizShowUi();
  viz.raf=requestAnimationFrame(vizLoop);
}
function vizClose(fromPop){
  if(!viz)return;const v=viz;viz=null;
  cancelAnimationFrame(v.raf);clearTimeout(v.idle);removeEventListener('resize',vizSize);
  try{fxN.tap.disconnect(v.an);}catch(e){}
  $('#viz').classList.remove('open','ui');$('#vizart').style.display='none';
  fxSave();if(!fromPop&&history.state&&history.state.viz)history.back();
  if(sheetKind==='fx')fxSheet();
}
function vizShowUi(){if(!viz)return;$('#viz').classList.add('ui');clearTimeout(viz.idle);viz.idle=setTimeout(()=>{if(viz)$('#viz').classList.remove('ui');},4000);}
function vizSize(){
  if(!viz)return;
  const dpr=LOW_DEVICE?1:Math.min(1.5,devicePixelRatio||1),mx=LOW_DEVICE?960:1920,sc=Math.min(dpr,mx/innerWidth)*viz.scale;
  viz.w=viz.cv.width=viz.gl.width=Math.max(160,Math.round(innerWidth*sc));viz.h=viz.cv.height=viz.gl.height=Math.max(120,Math.round(innerHeight*sc));
  viz.ctx.fillStyle='#04090f';viz.ctx.fillRect(0,0,viz.w,viz.h);
  if(viz.milk)try{viz.milk.setRendererSize(viz.w,viz.h);}catch(e){}
}
function vizSetMode(m){
  if(!viz)return;
  if(!vizList().some(x=>x[0]===m))m='ring';
  viz.mode=m;fx.vizMode=m;fxSave();fxMark();
  $('#vizmode').textContent=(VIZ_MODES.find(x=>x[0]===m)||[])[1]||'';
  $('#vizart').style.display=m==='ring'?'block':'none';
  viz.cv.style.display=m==='milk'?'none':'block';viz.gl.style.display=m==='milk'?'block':'none';
  viz.frames=0;viz.fpsT=performance.now();viz.low=0;
  if(m!=='milk'){viz.ctx.globalCompositeOperation='source-over';viz.ctx.fillStyle='#04090f';viz.ctx.fillRect(0,0,viz.w,viz.h);}
  else milkStart();
}
function loadScript(u){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>ng(new Error('読み込めませんでした'));document.head.appendChild(s);});}
let milkLib=null;
async function milkStart(){
  if(!viz||viz.milk)return;const v=viz;
  try{
    if(!milkLib){toast('ミルクドロップを読み込んでいます');
      await loadScript('https://cdn.jsdelivr.net/npm/butterchurn@2.6.7/lib/butterchurn.min.js');await loadScript('https://cdn.jsdelivr.net/npm/butterchurn-presets@2.4.7/lib/butterchurnPresets.min.js');
      const P=window.butterchurnPresets;milkLib={make:(window.butterchurn.default||window.butterchurn).createVisualizer,presets:(P.default||P).getPresets()};}
    if(viz!==v)return;
    v.milk=milkLib.make(fxCtx,v.gl,{width:v.w,height:v.h,pixelRatio:1,textureRatio:LOW_DEVICE?.5:1});
    v.milk.connectAudio(fxN.tap);v.milkNames=shuffle(Object.keys(milkLib.presets));v.milkI=0;v.milkAt=0;
  }catch(e){if(viz===v){toast('ミルクドロップを使えません: '+e.message);vizSetMode('ring');}}
}
function vizCaption(s){
  if(!viz||!s||viz.songId===s.id)return;viz.songId=s.id;const al=alOf(s);viz.hue=al.h||202;
  $('#vizcap').innerHTML=`<b>${esc(s.t)}</b><small>${esc(s.ar||al.a)} ・ ${esc(al.t)}</small>`;
  const a=$('#vizart');a.style.background=artBg(al,1000);a.style.backgroundSize='cover';
}
function vizBands(n){   // 周波数を対数で n 本に分ける
  const f=viz.freq,N=f.length,hz=fxCtx.sampleRate/2/N,out=new Array(n);
  for(let i=0;i<n;i++){const a=Math.max(1,Math.floor(40*Math.pow(16000/40,i/n)/hz)),b=Math.max(a+1,Math.floor(40*Math.pow(16000/40,(i+1)/n)/hz));let m=0;for(let j=a;j<b&&j<N;j++)if(f[j]>m)m=f[j];out[i]=m/255;}
  return out;
}
const VIZ_DRAW={
  ring(c,w,h,v,bass){
    const cx=w/2,cy=h/2,r=Math.min(w,h)*.24,n=LOW_DEVICE?56:96,B=vizBands(n),rot=v.t*.00012,fade=.28;
    c.globalCompositeOperation='source-over';c.fillStyle=`rgba(4,9,15,${fade})`;c.fillRect(0,0,w,h);
    c.globalCompositeOperation='lighter';c.lineCap='round';
    for(let i=0;i<n;i++){for(const sgn of [1,-1]){
      const a=rot+sgn*(i+.5)/n*Math.PI-Math.PI/2,len=Math.pow(B[i],1.5)*Math.min(w,h)*.26+2,x0=Math.cos(a),y0=Math.sin(a),hue=(v.hue+i*.9)%360;
      c.strokeStyle=`hsla(${hue},90%,62%,.9)`;c.lineWidth=Math.max(1.5,r*.032);c.beginPath();c.moveTo(cx+x0*(r+8),cy+y0*(r+8));c.lineTo(cx+x0*(r+8+len),cy+y0*(r+8+len));c.stroke();
    }}
    const s=1+bass*.08;$('#vizart').style.transform=`translate(-50%,-50%) scale(${s.toFixed(3)})`;
  },
  bars(c,w,h,v){
    const n=LOW_DEVICE?28:56,B=vizBands(n),gap=w*.004,bw=(w-gap*(n+1))/n,seg=Math.max(4,h*.016),base=h*.72;
    c.globalCompositeOperation='source-over';c.fillStyle='#04090f';c.fillRect(0,0,w,h);
    const P=v.peaks;
    for(let i=0;i<n;i++){
      const lv=Math.pow(B[i],1.4),H=lv*base*.92,x=gap+i*(bw+gap),count=Math.floor(H/(seg+2)),hue=(v.hue+i*2.2)%360;
      for(let k=0;k<count;k++){const y=base-(k+1)*(seg+2);c.fillStyle=`hsl(${(hue+k*1.5)%360},90%,${48+k/count*22}%)`;c.fillRect(x,y,bw,seg);if(!LOW_DEVICE||k%2===0){c.fillStyle=`hsla(${hue},90%,55%,${.22*(1-k/Math.max(1,count))})`;c.fillRect(x,base+k*(seg+2),bw,seg);}}
      P[i]=Math.max((P[i]||0)-h*.006,H);c.fillStyle='#fff';c.fillRect(x,base-P[i]-seg,bw,Math.max(2,seg*.4));
    }
  },
  wave(c,w,h,v){
    c.globalCompositeOperation='source-over';c.fillStyle='rgba(4,9,15,.3)';c.fillRect(0,0,w,h);
    v.an.getByteTimeDomainData(v.time);const T=v.time,N=T.length,step=Math.max(1,Math.floor(N/(LOW_DEVICE?256:512)));
    c.globalCompositeOperation='lighter';c.lineJoin='round';
    const path=(off,amp)=>{c.beginPath();for(let i=0,k=0;i<N;i+=step,k++){const x=i/N*w,y=h/2+off+(T[i]-128)/128*amp;k?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();};
    for(const [off,hue] of [[0,v.hue],[h*.09,(v.hue+50)%360],[-h*.09,(v.hue-50+360)%360]]){
      const amp=h*.42*(off?.55:1);
      c.strokeStyle=`hsla(${hue},95%,60%,.14)`;c.lineWidth=h*.022;path(off,amp);
      c.strokeStyle=`hsla(${hue},95%,68%,.4)`;c.lineWidth=h*.008;path(off,amp);
      c.strokeStyle=`hsla(${hue},80%,90%,.95)`;c.lineWidth=Math.max(1.5,h*.0028);path(off,amp);
    }
  },
  aurora(c,w,h,v,bass,mid,high){   // 光のカーテン: 波打つ線から縦の光を垂らす
    c.globalCompositeOperation='source-over';c.fillStyle='rgba(4,9,15,.22)';c.fillRect(0,0,w,h);
    c.globalCompositeOperation='lighter';
    const L=[[bass,.2,.00042,0,1],[mid,.34,.00061,48,-1],[high,.12,.00083,-48,1]],n=LOW_DEVICE?42:96,t=v.t;
    for(const [lv,yy,sp,dh,dir] of L){
      const hue=(v.hue+dh+360)%360,g=c.createLinearGradient(0,0,0,1),a=.1+lv*.5;
      g.addColorStop(0,`hsla(${hue},100%,70%,0)`);g.addColorStop(.12,`hsla(${hue},100%,72%,${a})`);g.addColorStop(.45,`hsla(${(hue+30)%360},95%,55%,${a*.45})`);g.addColorStop(1,`hsla(${(hue+60)%360},90%,45%,0)`);
      c.fillStyle=g;
      for(let i=0;i<n;i++){
        const u=i/n,wave=Math.sin(u*7+dir*t*sp)*.5+Math.sin(u*17-dir*t*sp*1.7)*.25,top=h*(yy+wave*.1),rays=.55+.45*Math.sin(u*43+dir*t*sp*3),len=h*(.3+lv*.55)*rays;
        const x0=Math.round(u*w),x1=Math.round((i+1)/n*w);c.setTransform(1,0,0,len,x0,top);c.fillRect(0,0,x1-x0,1);
      }
      c.setTransform(1,0,0,1,0,0);
    }
  },
  stars(c,w,h,v,bass){
    const n=LOW_DEVICE?130:340,S=v.stars,cx=w/2,cy=h/2,sp=.004+bass*bass*.05,f=Math.min(w,h)*.7;
    while(S.length<n)S.push({x:(Math.random()-.5)*2.4,y:(Math.random()-.5)*2.4,z:Math.random()});
    c.globalCompositeOperation='source-over';c.fillStyle=`rgba(4,9,15,${.34-bass*.2})`;c.fillRect(0,0,w,h);
    c.globalCompositeOperation='lighter';c.lineCap='round';
    for(const s of S){
      const pz=s.z;s.z-=sp;if(s.z<=.02){s.x=(Math.random()-.5)*2.4;s.y=(Math.random()-.5)*2.4;s.z=1;continue;}
      const X=cx+s.x/s.z*f,Y=cy+s.y/s.z*f,PX=cx+s.x/pz*f,PY=cy+s.y/pz*f,a=Math.min(1,(1-s.z)*1.4);
      c.strokeStyle=`hsla(${(v.hue+s.z*90)%360},90%,${60+(1-s.z)*30}%,${a})`;c.lineWidth=(1-s.z)*Math.min(w,h)*.006+.6;c.beginPath();c.moveTo(PX,PY);c.lineTo(X,Y);c.stroke();
    }
  }
};
function vizLoop(ts){
  if(!viz)return;const v=viz;v.raf=requestAnimationFrame(vizLoop);
  const minDt=LOW_DEVICE?30:16;if(ts-v.last<minDt)return;v.last=ts;
  v.t=ts;vizCaption(cur());
  v.an.getByteFrequencyData(v.freq);
  const avg=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=v.freq[i]||0;return s/Math.max(1,b-a)/255;},N=v.freq.length,hz=fxCtx.sampleRate/2/N;
  const bass=avg(1,Math.ceil(160/hz)),mid=avg(Math.ceil(160/hz),Math.ceil(2000/hz)),high=avg(Math.ceil(2000/hz),Math.ceil(12000/hz));
  if(v.mode==='milk'){
    if(v.milk){if(ts-v.milkAt>30000){v.milkAt=ts;const k=v.milkNames[v.milkI++%v.milkNames.length];v.milk.loadPreset(milkLib.presets[k],v.milkI===1?0:2.7);}v.milk.render();}
  }else VIZ_DRAW[v.mode](v.ctx,v.w,v.h,v,bass,mid,high);
  v.frames++;
  if(ts-v.fpsT>=4000){   // 遅ければ解像度を落とす。それでも遅いミルクドロップはリングに切り替える
    const fps=Math.round(v.frames*1000/(ts-v.fpsT));v.frames=0;v.fpsT=ts;(fx.vizFps=fx.vizFps||{})[v.mode]=fps;
    if(document.visibilityState==='visible'&&fps<18){
      if(v.scale>.45){v.scale*=.75;vizSize();}
      else if(v.mode==='milk'){toast('この端末ではミルクドロップが重いので、リングに切り替えました');vizSetMode('ring');}
    }
  }
}
addEventListener('popstate',()=>{if(viz)vizClose(true);});
addEventListener('keydown',e=>{
  if(!viz)return;vizShowUi();
  if(e.key==='Escape'){vizClose();e.preventDefault();}
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ACT.vizNext({d:e.key==='ArrowRight'?1:-1});e.preventDefault();}
});
if(LIVE)for(const ev of ['pointerdown','keydown'])document.addEventListener(ev,()=>{if(fxCtx&&fxCtx.state==='suspended')fxCtx.resume().catch(()=>{});},{passive:true});

/* --- ロード画面。JavaScript が重い間も止まらないよう、動きは transform と opacity だけ(GPU で動く) --- */
const LOADER={shownAt:0,cost:new Map()};
function loaderMsg(t){const m=$('#splmsg');if(m)m.textContent=t||'';}
function loaderShow(t){const s=$('#splash');s.classList.remove('off','boot');s.classList.add('quick');loaderMsg(t);s.hidden=false;void s.offsetWidth;s.classList.add('show');LOADER.shownAt=performance.now();}
function loaderHide(){const s=$('#splash');s.classList.remove('show');s.classList.add('off');clearTimeout(LOADER.t);LOADER.t=setTimeout(()=>{s.hidden=true;s.classList.remove('off');},420);}
const nextPaint=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const costKey=()=>{const r=route();return r.a==='library'||r.a==='settings'?r.a+'/'+(r.b||''):r.a;};
// ページの描画が遅いと分かっている切り替えだけロード画面を出す(端末ごとに実測して覚える)
const NAV_SLOW_MS=140;
function navRender(){
  const key=costKey(),known=LOADER.cost.get(key),big=SONGS.length>3000&&(key==='home'||key.startsWith('library/')||key==='search'||key==='');
  const slow=LIVE&&(known!=null?known>NAV_SLOW_MS:big);
  const seq=++LOADER.seq;
  const run=async()=>{
    const t0=performance.now();render();await nextPaint();
    LOADER.cost.set(key,performance.now()-t0);
    if(slow&&seq===LOADER.seq)loaderHide();
  };
  if(!slow){run();return;}
  loaderShow('');
  requestAnimationFrame(()=>setTimeout(()=>{if(seq===LOADER.seq)run();},0));   // ロード画面を一度描いてから、重い描画に入る
}
LOADER.seq=0;

/* ================= boot ================= */
const BOOT_T0=performance.now();
(async function boot(){
  if(LIVE){
    try{
      await authGate();
      SERVER=await api('/api/server');serverAt=Date.now();
      loaderMsg('ライブラリを読み込んでいます');
      await loadLibrary();await loadPlaylists();

      OUTS.splice(1);

  }

  applyTheme();render();renderMini();renderXP();
  await nextPaint();
  const wait=700-(performance.now()-BOOT_T0);if(wait>0)await new Promise(r=>setTimeout(r,wait));   // 一瞬で消えないように
  const sp=$('#splash');sp.classList.remove('boot');sp.classList.add('off');setTimeout(()=>{sp.hidden=true;sp.classList.remove('off');},420);
})();
